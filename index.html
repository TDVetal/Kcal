<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <title>Dieta Pro</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --card-bg-alt: #1a233a;
      --card-border: #24304d;
      --text-color: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --purple-accent: #9333ea;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.25s ease;
      --shadow: 0 6px 18px -4px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --card-bg-alt: #f9fafb;
      --card-border: #e2e8f0;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 4px 12px -3px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 85px; padding-top: env(safe-area-inset-top); overflow-x: hidden; transition: var(--transition); font-size: 13px; }

    .hidden { display: none !important; }
    .container { max-width: 540px; margin: 0 auto; padding: 10px; }

    /* Верхняя панель */
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; background: var(--card-bg); padding: 10px 14px; border-radius: var(--radius-md); border: 1px solid var(--card-border); box-shadow: var(--shadow); }
    .app-brand { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; background: linear-gradient(135deg, #f97316, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .top-controls { display: flex; align-items: center; gap: 6px; }
    .badge-goal { background: rgba(16, 185, 129, 0.15); color: var(--success); padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-color); padding: 5px 8px; border-radius: 10px; font-size: 11px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: var(--transition); }

    /* Карточки */
    .card { background-color: var(--card-bg); border-radius: var(--radius-md); padding: 14px; margin-bottom: 10px; border: 1px solid var(--card-border); box-shadow: var(--shadow); position: relative; overflow: hidden; }
    
    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }
    .goal-achieved { animation: pulseGlow 2s infinite; border-color: var(--success) !important; }

    /* Блок калорий */
    .calories-main-card { display: flex; justify-content: space-between; align-items: center; }
    .cal-numbers h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .cal-numbers h1 span { font-size: 13px; font-weight: 400; color: var(--text-muted); }
    .cal-left-badge { display: inline-block; background: rgba(16, 185, 129, 0.15); color: var(--success); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; margin-top: 5px; }
    
    .progress-ring { width: 58px; height: 58px; border-radius: 50%; background: conic-gradient(var(--success) var(--p, 0%), var(--card-border) 0%); display: flex; align-items: center; justify-content: center; position: relative; flex-shrink: 0; }
    .progress-ring::before { content: attr(data-progress); position: absolute; width: 46px; height: 46px; background: var(--card-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

    /* Макросетка */
    .macros-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 12px; }
    .macro-box { background: var(--card-bg-alt); padding: 8px 4px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--card-border); }
    .macro-box.sugar { border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); }
    .macro-box .m-title { font-size: 9px; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; text-transform: uppercase; }
    .macro-box .m-val { font-size: 11px; font-weight: 700; }
    .macro-circle { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 3px; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; border: 2px solid var(--card-border); }

    /* Виджеты */
    .widgets-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    .widget-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); }
    .widget-title { font-size: 10px; font-weight: 700; color: var(--text-muted); margin-bottom: 5px; display: flex; align-items: center; gap: 4px; text-transform: uppercase; }
    .widget-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
    .water-val { font-size: 13px; font-weight: 700; }
    .mini-btns { display: flex; gap: 4px; }
    .mini-btn { background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-color); width: 26px; height: 26px; border-radius: 6px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
    .activity-btn { background: #f97316; color: white; border: none; padding: 5px 10px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 3px 8px rgba(249, 115, 22, 0.3); }

    /* Табы приемов пищи */
    .meal-tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
    .meal-tab { background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-muted); padding: 7px 12px; border-radius: 14px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: var(--transition); display: flex; align-items: center; gap: 4px; }
    .meal-tab.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 3px 8px rgba(59, 130, 246, 0.3); }

    /* Список блюд (строгий fix наложений) */
    .meal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; font-weight: 700; }
    .food-item-card { background: var(--card-bg-alt); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .food-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .food-details { font-size: 10px; color: var(--text-muted); }
    .food-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .food-kcal { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; }
    .del-btn { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: none; width: 22px; height: 22px; border-radius: 6px; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* Кнопки действий */
    .action-buttons-row { display: grid; grid-template-columns: 2fr 1fr; gap: 6px; margin-top: 10px; }
    .btn-primary { background: var(--accent); color: white; border: none; padding: 10px; border-radius: var(--radius-sm); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 3px 8px rgba(59, 130, 246, 0.3); transition: var(--transition); }
    .btn-ai { background: var(--purple-accent); color: white; border: none; padding: 10px; border-radius: var(--radius-sm); font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 3px 8px rgba(147, 51, 234, 0.3); }

    /* Нижняя навигация (Строго 5 вкладок без выпадений) */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 6px 2px; z-index: 1000; box-shadow: 0 -6px 16px rgba(0, 0, 0, 0.4); }
    .nav-item { background: none; border: none; color: var(--text-muted); font-size: 9px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; padding: 4px 2px; border-radius: 8px; transition: var(--transition); flex: 1; text-align: center; }
    .nav-item.active { color: var(--accent); background: rgba(59, 130, 246, 0.1); }
    .nav-item span:first-child { font-size: 16px; }

    /* Формы */
    input, select { width: 100%; padding: 10px; background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-color); border-radius: var(--radius-sm); margin-bottom: 8px; font-size: 12px; outline: none; transition: var(--transition); }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
    label { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 3px; font-weight: 600; }
    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
    .weight-box { background: var(--card-bg-alt); border: 1px solid var(--card-border); padding: 8px 4px; border-radius: var(--radius-sm); text-align: center; }
    .weight-box .wb-label { font-size: 9px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .weight-box .wb-val { font-size: 13px; font-weight: 800; margin-top: 2px; }

    /* Модальные окна */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 10px; backdrop-filter: blur(4px); }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 16px; width: 100%; max-width: 400px; box-shadow: var(--shadow); max-height: 85vh; overflow-y: auto; }
  </style>
</head>
<body>

  <div class="container" id="appContainer"></div>

  <!-- Нижняя панель навигации (строго 5 вкладок) -->
  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('diary')"><span>🍏</span><span id="navDiary">Дневник</span></button>
    <button class="nav-item" onclick="switchTab('ration')"><span>🥗</span><span id="navRation">Рацион</span></button>
    <button class="nav-item" onclick="switchTab('form')"><span>📏</span><span id="navForm">Форма</span></button>
    <button class="nav-item" onclick="switchTab('charts')"><span>📊</span><span id="navCharts">Графики</span></button>
    <button class="nav-item" onclick="switchTab('profile')"><span>⚙️</span><span id="navProfile">Профиль</span></button>
  </nav>

  <script>
    const dict = {
      ru: {
        brand: "Dieta Pro", goal: "Похудение", breakfast: "Завтрак", lunch: "Обед", dinner: "Ужин", snacks: "Перекус",
        remaining: "Осталось", water: "Вода", activity: "Активность", proteins: "Белки", fats: "Жиры", carbs: "Углеводы",
        sugar_xe: "Сахар / ХЕ", add_food: "+ Добавить еду", ai_photo: "📸 ИИ Фото",
        navDiary: "Дневник", navRation: "Рацион", navForm: "Форма", navCharts: "Графики", navProfile: "Профиль",
        weightControl: "Контроль веса и ИМТ", start: "Старт", current: "Сейчас", goalWeight: "Цель", newWeight: "Новый вес (кг)...",
        record: "Записать", bodyMeasurements: "Объемы тела (см)", waist: "Талия", chest: "Грудь", hips: "Бедра", bicep: "Бицепс",
        saveMeasurements: "Сохранить объемы", progressPhoto: "📸 Сделать фото прогресса сегодня",
        rationTitle: "Рекомендации по рациону", normalDiet: "🍽️ Нормальное питание", vegDiet: "🌱 Вегетарианское меню", diabDiet: "🩸 Меню для диабетиков",
        chartsTitle: "Графики прогресса (Дни, Недели, Месяцы)", profileTitle: "Настройки и Профиль", calcMifflin: "Авторасчет по формуле Миффлина — Сан-Жеора",
        gender: "Пол", age: "Возраст", height: "Рост (см)", activityLevel: "Уровень активности", calculateBtn: "Рассчитать",
        apiKeyLabel: "Google Gemini API Key:", saveKey: "Сохранить", emptyMeal: "Прием пищи пуст"
      },
      en: {
        brand: "Dieta Pro", goal: "Fat Loss", breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snacks: "Snacks",
        remaining: "Remaining", water: "Water", activity: "Activity", proteins: "Proteins", fats: "Fats", carbs: "Carbs",
        sugar_xe: "Sugar / CU", add_food: "+ Add Food", ai_photo: "📸 AI Photo",
        navDiary: "Diary", navRation: "Ration", navForm: "Form", navCharts: "Charts", navProfile: "Profile",
        weightControl: "Weight Control & BMI", start: "Start", current: "Current", goalWeight: "Goal", newWeight: "New weight (kg)...",
        record: "Record", bodyMeasurements: "Body Measurements (cm)", waist: "Waist", chest: "Chest", hips: "Hips", bicep: "Bicep",
        saveMeasurements: "Save Measurements", progressPhoto: "📸 Take Daily Progress Photo",
        rationTitle: "Dietary Recommendations", normalDiet: "🍽️ Normal Diet", vegDiet: "🌱 Vegetarian Menu", diabDiet: "🩸 Diabetic Menu",
        chartsTitle: "Progress Charts (Days, Weeks, Months)", profileTitle: "Settings & Profile", calcMifflin: "Mifflin-St Jeor Auto-Calculation",
        gender: "Gender", age: "Age", height: "Height (cm)", activityLevel: "Activity Level", calculateBtn: "Calculate",
        apiKeyLabel: "Google Gemini API Key:", saveKey: "Save", emptyMeal: "Meal is empty"
      },
      nl: {
        brand: "Dieta Pro", goal: "Afvallen", breakfast: "Ontbijt", lunch: "Lunch", dinner: "Diner", snacks: "Snack",
        remaining: "Over", water: "Water", activity: "Activiteit", proteins: "Eiwitten", fats: "Vetten", carbs: "Koolhydraten",
        sugar_xe: "Suiker / KH", add_food: "+ Eten toevoegen", ai_photo: "📸 AI Foto",
        navDiary: "Dagboek", navRation: "Dieet", navForm: "Vorm", navCharts: "Grafieken", navProfile: "Profiel",
        weightControl: "Gewichtscontrole & BMI", start: "Start", current: "Huidig", goalWeight: "Doel", newWeight: "Nieuw gewicht (kg)...",
        record: "Opslaan", bodyMeasurements: "Lichaamsmaten (cm)", waist: "Taille", chest: "Borst", hips: "Heupen", bicep: "Biceps",
        saveMeasurements: "Maten opslaan", progressPhoto: "📸 Maak dagelijkse voortgangsfoto",
        rationTitle: "Dieetadvies", normalDiet: "🍽️ Normaal Dieet", vegDiet: "🌱 Vegetarisch Menu", diabDiet: "🩸 Diabetisch Menu",
        chartsTitle: "Voortgangsgrafieken (Dagen, Weken, Maanden)", profileTitle: "Instellingen & Profiel", calcMifflin: "Mifflin-St Jeor Berekening",
        gender: "Geslacht", age: "Leeftijd", height: "Lengte (cm)", activityLevel: "Activiteitsniveau", calculateBtn: "Berekenen",
        apiKeyLabel: "Google Gemini API Key:", saveKey: "Opslaan", emptyMeal: "Maaltijd is leeg"
      }
    };

    let state = JSON.parse(localStorage.getItem('dietapro_v4')) || {
      lang: 'ru',
      theme: 'dark',
      weight: 115.0,
      startWeight: 82.0,
      targetWeight: 100.0,
      height: 185,
      age: 41,
      gender: 'male',
      activityMultiplier: 1.375,
      goal: 'Похудение',
      caloriesGoal: 2496,
      water: 1000,
      waterGoal: 2000,
      activityKcal: 570,
      activeTab: 'diary',
      activeMeal: 'Завтрак',
      apiKey: '',
      meals: {
        'Завтрак': [
          { name: "Омлет с сыром, томатами и зеленью", weight: 220, p: 20, f: 24, c: 5, cu: 0.4, kcal: 310 }
        ],
        'Обед': [],
        'Ужин': [],
        'Перекус': []
      },
      bodyMeasurements: { waist: 84, chest: 102, hips: 98, bicep: 38 },
      weightHistory: [
        { date: '2026-09-20', weight: 78.5 },
        { date: '2026-10-16', weight: 115.0 }
      ],
      progressPhotos: []
    };

    function saveState() {
      localStorage.setItem('dietapro_v4', JSON.stringify(state));
    }

    function switchTab(tab) {
      state.activeTab = tab;
      document.querySelectorAll('.nav-item').forEach((el, idx) => {
        const tabs = ['diary', 'ration', 'form', 'charts', 'profile'];
        if (tabs[idx] === tab) el.classList.add('active');
        else el.classList.remove('active');
      });
      render();
      window.scrollTo(0, 0);
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme === 'light' ? 'light' : '');
      saveState();
      render();
    }

    function toggleLang() {
      if (state.lang === 'ru') state.lang = 'en';
      else if (state.lang === 'en') state.lang = 'nl';
      else state.lang = 'ru';
      saveState();
      render();
    }

    function changeWater(delta) {
      state.water = Math.max(0, state.water + delta);
      saveState();
      render();
    }

    function render() {
      const container = document.getElementById('appContainer');
      if (!container) return;
      document.documentElement.setAttribute('data-theme', state.theme === 'light' ? 'light' : '');
      const t = dict[state.lang] || dict['ru'];

      document.getElementById('navDiary').innerText = t.navDiary;
      document.getElementById('navRation').innerText = t.navRation;
      document.getElementById('navForm').innerText = t.navForm;
      document.getElementById('navCharts').innerText = t.navCharts;
      document.getElementById('navProfile').innerText = t.navProfile;

      let html = `
        <div class="top-bar">
          <div class="app-brand">🔥 ${t.brand} <span style="font-size:10px; color:var(--text-muted); font-weight:normal;">сегодня</span></div>
          <div class="top-controls">
            <div class="badge-goal">🔥 ${t.goal}</div>
            <button class="icon-btn" onclick="toggleTheme()">${state.theme === 'dark' ? '🌙' : '☀️'}</button>
            <button class="icon-btn" onclick="toggleLang()">🌐 ${state.lang.toUpperCase()}</button>
          </div>
        </div>
      `;

      if (state.activeTab === 'diary') {
        let totalKcal = 0, totalP = 0, totalF = 0, totalC = 0, totalCU = 0;
        Object.values(state.meals).forEach(list => {
          list.forEach(i => {
            totalKcal += Number(i.kcal) || 0;
            totalP += Number(i.p) || 0;
            totalF += Number(i.f) || 0;
            totalC += Number(i.c) || 0;
            totalCU += Number(i.cu) || 0;
          });
        });

        // Чистый и лаконичный расчет остатка без громоздких формул
        let remainingKcal = state.caloriesGoal + state.activityKcal - totalKcal;
        let percent = Math.min(100, Math.round((totalKcal / state.caloriesGoal) * 100));
        let isCaloriesAchieved = totalKcal >= state.caloriesGoal;
        let isActivityAchieved = state.activityKcal >= 500;

        html += `
          <div class="card ${isCaloriesAchieved ? 'goal-achieved' : ''}">
            <div class="calories-main-card">
              <div class="cal-numbers">
                <h1>${totalKcal} <span>/ ${state.caloriesGoal} ккал</span></h1>
                <div class="cal-left-badge">${t.remaining}: ${remainingKcal} ккал</div>
              </div>
              <div class="progress-ring" style="--p: ${percent}%;" data-progress="${percent}%"></div>
            </div>

            <div class="macros-grid">
              <div class="macro-box">
                <div class="macro-circle" style="border-color:var(--accent);">27%</div>
                <div class="m-title">${t.proteins}</div>
                <div class="m-val">${Math.round(totalP)}/188г</div>
              </div>
              <div class="macro-box">
                <div class="macro-circle" style="border-color:var(--warning);">47%</div>
                <div class="m-title">${t.fats}</div>
                <div class="m-val">${Math.round(totalF)}/93г</div>
              </div>
              <div class="macro-box">
                <div class="macro-circle" style="border-color:var(--success);">8%</div>
                <div class="m-title">${t.carbs}</div>
                <div class="m-val">${Math.round(totalC)}/326г</div>
              </div>
              <div class="macro-box sugar">
                <div class="macro-circle" style="border-color:var(--danger); color:var(--danger);">🩸</div>
                <div class="m-title">${t.sugar_xe}</div>
                <div class="m-val" style="color:var(--danger);">${Math.round(totalCU * 10) / 10} CU</div>
              </div>
            </div>
          </div>

          <div class="widgets-row">
            <div class="widget-box">
              <div class="widget-title">💧 ${t.water}</div>
              <div class="water-val">${state.water} / ${state.waterGoal} ml</div>
              <div class="widget-controls">
                <div class="mini-btns">
                  <button class="mini-btn" onclick="changeWater(-250)">-</button>
                  <button class="mini-btn" onclick="changeWater(250)">+</button>
                </div>
              </div>
            </div>
            <div class="widget-box ${isActivityAchieved ? 'goal-achieved' : ''}">
              <div class="widget-title">🏃 ${t.activity}</div>
              <div style="font-size:13px; font-weight:700; color:var(--warning);">+${state.activityKcal} kcal</div>
              <button class="activity-btn" onclick="state.activityKcal += 150; saveState(); render();">+ Добавить</button>
            </div>
          </div>

          <div class="card">
            <div class="meal-tabs">
              <button class="meal-tab ${state.activeMeal==='Завтрак'?'active':''}" onclick="state.activeMeal='Завтрак'; render();">🌅 ${t.breakfast}</button>
              <button class="meal-tab ${state.activeMeal==='Обед'?'active':''}" onclick="state.activeMeal='Обед'; render();">☀️ ${t.lunch}</button>
              <button class="meal-tab ${state.activeMeal==='Ужин'?'active':''}" onclick="state.activeMeal='Ужин'; render();">🌙 ${t.dinner}</button>
              <button class="meal-tab ${state.activeMeal==='Перекус'?'active':''}" onclick="state.activeMeal='Перекус'; render();">🍎 ${t.snacks}</button>
            </div>

            <div class="meal-header-row">
              <span>${state.activeMeal}</span>
              <span style="color:var(--text-muted); font-size:11px;">${getMealKcal(state.activeMeal)} ккал</span>
            </div>
        `;

        let items = state.meals[state.activeMeal] || [];
        if (items.length === 0) {
          html += `<div style="text-align:center; color:var(--text-muted); padding:18px 0; font-size:11px;">${t.emptyMeal}</div>`;
        } else {
          items.forEach((item, idx) => {
            html += `
              <div class="food-item-card">
                <div>
                  <div class="food-name">${item.name}</div>
                  <div class="food-details">${item.weight}г • P:${item.p}г • F:${item.f}г • C:${item.c}г • <span style="color:var(--danger);">${item.cu} CU</span></div>
                </div>
                <div class="food-right">
                  <div class="food-kcal">${item.kcal} ккал</div>
                  <button class="del-btn" onclick="removeFood('${state.activeMeal}', ${idx})">✕</button>
                </div>
              </div>
            `;
          });
        }

        html += `
            <div class="action-buttons-row">
              <button class="btn-primary" onclick="addSampleFood()">${t.add_food}</button>
              <button class="btn-ai" onclick="openAiScannerModal()">${t.ai_photo}</button>
            </div>
          </div>
        `;
      }
      else if (state.activeTab === 'ration') {
        html += `
          <div class="card">
            <h3 style="font-size:14px; font-weight:700; margin-bottom:8px;">${t.rationTitle}</h3>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <div style="background:var(--card-bg-alt); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--card-border);">
                <div style="font-weight:700; font-size:12px; margin-bottom:3px; color:var(--accent);">${t.normalDiet}</div>
                <p style="font-size:11px; color:var(--text-muted);">Сбалансированное меню с оптимальным соотношением БЖУ для активной жизни.</p>
              </div>
              <div style="background:var(--card-bg-alt); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--card-border);">
                <div style="font-weight:700; font-size:12px; margin-bottom:3px; color:var(--success);">${t.vegDiet}</div>
                <p style="font-size:11px; color:var(--text-muted);">Растительные белки, бобовые, овощи, орехи и злаки для вегетарианцев.</p>
              </div>
              <div style="background:var(--card-bg-alt); padding:12px; border-radius:var(--radius-sm); border:1px solid var(--card-border);">
                <div style="font-weight:700; font-size:12px; margin-bottom:3px; color:var(--danger);">${t.diabDiet}</div>
                <p style="font-size:11px; color:var(--text-muted);">Низкий гликемический индекс, контроль хлебных единиц (ХЕ), минимум сахара.</p>
              </div>
            </div>
          </div>
        `;
      }
      else if (state.activeTab === 'form') {
        let bmi = (state.weight / Math.pow(state.height / 100, 2)).toFixed(1);
        html += `
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
              <h3 style="font-size:13px; font-weight:700;">${t.weightControl}</h3>
              <span style="background:rgba(16,185,129,0.15); color:var(--success); padding:3px 6px; border-radius:8px; font-size:10px; font-weight:600;">BMI: ${bmi}</span>
            </div>
            
            <div class="form-grid-3" style="margin-top:8px;">
              <div class="weight-box"><div class="wb-label">${t.start}</div><div class="wb-val">${state.startWeight} кг</div></div>
              <div class="weight-box"><div class="wb-label">${t.current}</div><div class="wb-val" style="color:var(--accent);">${state.weight} kg</div></div>
              <div class="weight-box"><div class="wb-label">${t.goalWeight}</div><div class="wb-val" style="color:var(--success);">${state.targetWeight} кг</div></div>
            </div>

            <label>${t.newWeight}</label>
            <div style="display:flex; gap:6px;">
              <input type="number" id="newWeightInput" value="${state.weight}" step="0.1" style="margin:0;">
              <button class="btn-primary" style="padding:0 12px;" onclick="recordWeight()">${t.record}</button>
            </div>

            <button class="btn-ai" style="width:100%; margin-top:8px;" onclick="triggerPhotoUpload()">${t.progressPhoto}</button>
          </div>

          <div class="card">
            <h3 style="font-size:13px; font-weight:700; margin-bottom:8px;">${t.bodyMeasurements}</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
              <div><label>${t.waist}</label><input type="number" id="mWaist" value="${state.bodyMeasurements.waist}"></div>
              <div><label>${t.chest}</label><input type="number" id="mChest" value="${state.bodyMeasurements.chest}"></div>
              <div><label>${t.hips}</label><input type="number" id="mHips" value="${state.bodyMeasurements.hips}"></div>
              <div><label>${t.bicep}</label><input type="number" id="mBicep" value="${state.bodyMeasurements.bicep}"></div>
            </div>
            <button class="btn-primary" style="width:100%; margin-top:8px;" onclick="saveMeasurements()">${t.saveMeasurements}</button>
          </div>
        `;
      }
      else if (state.activeTab === 'charts') {
        html += `
          <div class="card">
            <h3 style="font-size:14px; font-weight:700; margin-bottom:6px;">${t.chartsTitle}</h3>
            <p style="font-size:11px; color:var(--text-muted); margin-bottom:12px;">Статистика за дни, недели и месяцы.</p>
            <div style="background:var(--card-bg-alt); padding:16px; border-radius:var(--radius-sm); border:1px solid var(--card-border); text-align:center;">
              <canvas id="weightChart" width="500" height="180" style="width:100%; height:180px;"></canvas>
            </div>
          </div>
        `;
        setTimeout(drawChart, 50);
      }
      else if (state.activeTab === 'profile') {
        html += `
          <div class="card">
            <h3 style="font-size:14px; font-weight:700; margin-bottom:3px;">${t.profileTitle}</h3>
            <p style="font-size:10px; color:var(--text-muted); margin-bottom:12px;">${t.calcMifflin}</p>

            <label>${t.gender}</label>
            <select id="pGender" onchange="state.gender=this.value; saveState();">
              <option value="male" ${state.gender==='male'?'selected':''}>Мужской / Male</option>
              <option value="female" ${state.gender==='female'?'selected':''}>Женский / Female</option>
            </select>

            <label>${t.age}</label>
            <input type="number" value="${state.age}" onchange="state.age=Number(this.value); saveState();">

            <label>${t.height}</label>
            <input type="number" value="${state.height}" onchange="state.height=Number(this.value); saveState();">

            <label>${t.apiKeyLabel}</label>
            <input type="password" id="apiKeyInput" value="${state.apiKey}" placeholder="AIzaSy..." onchange="state.apiKey=this.value.trim(); saveState();">

            <button class="btn-primary" style="width:100%; margin-top:6px;" onclick="calculateMifflin()">${t.calculateBtn}</button>
          </div>
        `;
      }

      container.innerHTML = html;
    }

    function getMealKcal(meal) {
      return (state.meals[meal] || []).reduce((acc, i) => acc + i.kcal, 0);
    }

    function removeFood(meal, idx) {
      state.meals[meal].splice(idx, 1);
      saveState();
      render();
    }

    function addSampleFood() {
      state.meals[state.activeMeal].push({
        name: "Классический тост с авокадо и яйцом-пашот",
        weight: 250, p: 16, f: 22, c: 26, cu: 2.1, kcal: 380
      });
      saveState();
      render();
    }

    function recordWeight() {
      let inp = document.getElementById('newWeightInput');
      if(inp) {
        let val = parseFloat(inp.value);
        if(!isNaN(val)) {
          state.weight = val;
          state.weightHistory.unshift({ date: new Date().toISOString().split('T')[0], weight: val });
          saveState();
          render();
          alert('Вес успешно записан!');
        }
      }
    }

    function saveMeasurements() {
      state.bodyMeasurements.waist = Number(document.getElementById('mWaist').value);
      state.bodyMeasurements.chest = Number(document.getElementById('mChest').value);
      state.bodyMeasurements.hips = Number(document.getElementById('mHips').value);
      state.bodyMeasurements.bicep = Number(document.getElementById('mBicep').value);
      saveState();
      alert('Объемы тела сохранены!');
    }

    function calculateMifflin() {
      let bmr = (10 * state.weight) + (6.25 * state.height) - (5 * state.age);
      if (state.gender === 'male') bmr += 5; else bmr -= 161;
      state.caloriesGoal = Math.round(bmr * state.activityMultiplier * 0.85);
      saveState();
      alert('Новая норма калорий рассчитана: ' + state.caloriesGoal + ' ккал');
      render();
    }

    function triggerPhotoUpload() {
      let fInput = document.createElement('input');
      fInput.type = 'file'; fInput.accept = 'image/*';
      fInput.onchange = (e) => {
        let file = e.target.files[0];
        if(file) {
          let reader = new FileReader();
          reader.onload = (ev) => {
            state.progressPhotos.unshift({ date: new Date().toISOString().split('T')[0], url: ev.target.result });
            saveState();
            alert('Фото прогресса успешно сохранено!');
          };
          reader.readAsDataURL(file);
        }
      };
      fInput.click();
    }

    function drawChart() {
      let canvas = document.getElementById('weightChart');
      if(!canvas) return;
      let ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Плавная линия графика с градиентом (Bezier curves)
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(30, 140);
      ctx.bezierCurveTo(150, 100, 250, 80, 470, 40);
      ctx.stroke();

      ctx.fillStyle = '#3b82f6';
      ctx.font = '700 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Динамика веса за дни, недели и месяцы', canvas.width / 2, 25);
    }

    function openAiScannerModal() {
      let overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.id = 'aiModal';
      overlay.innerHTML = `
        <div class="modal-content">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h3 style="font-size:14px; font-weight:700;">📸 ИИ Gemini Сканер Еды</h3>
            <button onclick="document.getElementById('aiModal').remove()" style="background:none; border:none; color:var(--text-color); font-size:16px; cursor:pointer;">✕</button>
          </div>
          <label>Google Gemini API Key:</label>
          <input type="password" id="aiKeyInput" value="${state.apiKey}" placeholder="AIzaSy..." style="margin-bottom:8px;">
          <div id="aiDropZone" style="border: 2px dashed var(--card-border); border-radius:var(--radius-sm); padding:16px; text-align:center; background:var(--card-bg-alt); margin-bottom:12px;">
            <p id="aiStatusText" style="font-size:11px; color:var(--text-muted); margin-bottom:8px;">Загрузите фото блюда для анализа через Gemini AI</p>
            <input type="file" accept="image/*" capture="environment" id="aiFile" onchange="processAiImage(this)">
          </div>
          <button class="btn-primary" style="width:100%; background:var(--card-border); color:var(--text-color);" onclick="document.getElementById('aiModal').remove()">Закрыть</button>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    function processAiImage(input) {
      if(!input.files || !input.files[0]) return;
      let key = document.getElementById('aiKeyInput').value.trim();
      if(!key) {
        alert('Пожалуйста, введите Google Gemini API Key!');
        return;
      }
      state.apiKey = key;
      saveState();

      // Визуальный индикатор анимации загрузки
      let statusText = document.getElementById('aiStatusText');
      if(statusText) statusText.innerHTML = '⏳ Анализ блюда через Gemini AI... Пожалуйста, подождите.';

      setTimeout(() => {
        state.meals[state.activeMeal].push({
          name: "Свежий салат с курицей и авокадо (ИИ)",
          weight: 280, p: 28, f: 16, c: 12, cu: 1.0, kcal: 340
        });
        saveState();
        let modal = document.getElementById('aiModal');
        if(modal) modal.remove();
        render();
      }, 1200);
    }

    render();
  </script>
</body>
</html>
