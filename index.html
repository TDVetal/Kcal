  <style>
    /* ========================================================================== */
    /* 1. CSS CUSTOM PROPERTIES & DESIGN TOKENS (DARK / LIGHT THEMES)             */
    /* ========================================================================== */
    :root {
      --bg-color: #030712;
      --card-bg: #111827;
      --card-bg-alt: #1f2937;
      --card-border: #374151;
      --text-color: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.15);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.15);
      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 24px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-bg-alt: #f9fafb;
      --card-border: #e5e7eb;
      --text-color: #111827;
      --text-muted: #6b7280;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    /* ========================================================================== */
    /* 2. GLOBAL RESET & BASE STYLING                                             */
    /* ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 110px;
      padding-top: env(safe-area-inset-top);
      transition: var(--transition);
      overflow-x: hidden;
      min-height: 100%;
      line-height: 1.5;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* Utility Classes */
    .hidden { 
      display: none !important; 
    }
    
    .container { 
      max-width: 680px; 
      margin: 0 auto; 
      padding: 20px; 
    }
    
    /* ========================================================================== */
    /* 3. CARD COMPONENTS & LAYOUT CONTAINERS                                     */
    /* ========================================================================== */
    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 22px;
      margin-bottom: 18px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      border-color: rgba(99, 102, 241, 0.3);
    }

    .card-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 16px; 
    }
    
    .card-title { 
      font-size: 20px; 
      font-weight: 700; 
      letter-spacing: -0.025em; 
      color: var(--text-color); 
    }
    
    .card-subtitle { 
      color: var(--text-muted); 
      font-size: 13px; 
      margin-top: 4px; 
      line-height: 1.4;
    }

    /* ========================================================================== */
    /* 4. INTERACTIVE BUTTONS & CONTROLS                                          */
    /* ========================================================================== */
    button {
      cursor: pointer; 
      border: none; 
      border-radius: var(--radius-sm);
      padding: 12px 20px; 
      font-weight: 600; 
      font-size: 14px;
      background: var(--accent); 
      color: white; 
      transition: var(--transition);
      display: inline-flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      position: relative;
      user-select: none;
    }

    button:active { 
      transform: scale(0.97); 
    }

    button:hover { 
      background: var(--accent-hover); 
      box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4); 
    }

    button.secondary { 
      background: var(--card-bg-alt); 
      color: var(--text-color); 
      border: 1px solid var(--card-border); 
      box-shadow: none; 
    }

    button.secondary:hover { 
      background: var(--card-border); 
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    button.danger { 
      background: var(--danger); 
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); 
    }

    button.danger:hover { 
      background: #dc2626; 
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4); 
    }

    /* ========================================================================== */
    /* 5. FORM INPUTS, SELECTS & LABELS                                           */
    /* ========================================================================== */
    input, select, textarea {
      width: 100%; 
      padding: 14px 16px; 
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border); 
      background: var(--card-bg-alt);
      color: var(--text-color); 
      margin-top: 6px; 
      margin-bottom: 16px; 
      font-size: 15px;
      transition: var(--transition);
    }

    input:hover, select:hover, textarea:hover {
      border-color: var(--text-muted);
    }

    input:focus, select:focus, textarea:focus { 
      outline: none; 
      border-color: var(--accent); 
      box-shadow: 0 0 0 3px var(--accent-light); 
      background: var(--card-bg);
    }

    label { 
      font-size: 13px; 
      font-weight: 500; 
      color: var(--text-muted); 
      display: block; 
      margin-bottom: 4px; 
    }

    /* ========================================================================== */
    /* 6. BOTTOM NAVIGATION BAR (PWA APP SHELL)                                   */
    /* ========================================================================== */
    .nav-bar {
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0;
      background: var(--card-bg); 
      backdrop-filter: blur(16px); 
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--card-border); 
      display: flex; 
      justify-content: space-around;
      padding: 12px 0; 
      z-index: 1000; 
      box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.3);
    }

    .nav-item {
      background: none; 
      color: var(--text-muted); 
      font-size: 11px; 
      font-weight: 500;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 5px;
      cursor: pointer; 
      border: none; 
      padding: 6px 14px; 
      border-radius: var(--radius-sm);
      transition: var(--transition); 
      box-shadow: none;
    }

    .nav-item.active { 
      color: var(--accent); 
      background: var(--accent-light); 
    }

    .nav-item span.icon { 
      font-size: 22px; 
    }

    /* ========================================================================== */
    /* 7. MACRO-NUTRIENTS GRID & ANALYTICS WIDGETS                                */
    /* ========================================================================== */
    .macro-grid { 
      display: grid; 
      grid-template-columns: repeat(4, 1fr); 
      gap: 10px; 
      margin-top: 16px; 
    }

    .macro-card { 
      background: var(--card-bg-alt); 
      padding: 14px 8px; 
      border-radius: var(--radius-sm); 
      text-align: center; 
      border: 1px solid var(--card-border); 
      transition: var(--transition);
    }

    .macro-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .macro-card .title { 
      color: var(--text-muted); 
      font-size: 11px; 
      font-weight: 600; 
      text-transform: uppercase; 
      letter-spacing: 0.05em;
    }

    .macro-card .val { 
      font-size: 15px; 
      font-weight: 700; 
      margin-top: 6px; 
      color: var(--text-color); 
    }

    /* ========================================================================== */
    /* 8. CANVAS CHARTS & MODAL OVERLAYS                                          */
    /* ========================================================================== */
    .chart-container { 
      position: relative; 
      width: 100%; 
      margin-top: 16px; 
      background: var(--card-bg-alt); 
      border-radius: var(--radius-sm); 
      border: 1px solid var(--card-border); 
      padding: 12px; 
    }

    canvas { 
      width: 100% !important; 
      height: 220px !important; 
      border-radius: 8px; 
    }

    .modal {
      position: fixed; 
      top: 0; 
      left: 0; 
      right: 0; 
      bottom: 0;
      background: rgba(3, 7, 18, 0.8); 
      backdrop-filter: blur(8px); 
      -webkit-backdrop-filter: blur(8px);
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 2000; 
      padding: 16px;
      animation: fadeIn 0.2s ease-out forwards;
    }

    .modal-content {
      background: var(--card-bg); 
      width: 100%; 
      max-width: 520px;
      border-radius: var(--radius-lg); 
      padding: 28px; 
      border: 1px solid var(--card-border);
      max-height: 90vh; 
      overflow-y: auto; 
      box-shadow: var(--shadow);
      animation: scaleUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes scaleUp {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Responsive Media Queries */
    @media (max-width: 480px) {
      .container { padding: 12px; }
      .card { padding: 16px; }
      .macro-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    }
  </style>
</head>

    }

    function calculateDailyTotals() {
      let totals = { kcal: 0, p: 0, f: 0, c: 0, cu: 0 };
      Object.keys(todayData.meals).forEach(mealKey => {
        (todayData.meals[mealKey] || []).forEach(item => {
          totals.kcal += Number(item.kcal) || 0;
          totals.p += Number(item.p) || 0;
          totals.f += Number(item.f) || 0;
          totals.c += Number(item.c) || 0;
          totals.cu += Number(item.cu) || 0;
        });
      });
      totals.p = Math.round(totals.p);
      totals.f = Math.round(totals.f);
      totals.c = Math.round(totals.c);
      totals.cu = roundNum(totals.cu, 1);
      return totals;
    }

    function filterFoodDatabase(query) {
      const resultsContainer = document.getElementById('foodSearchResults');
      if (!resultsContainer) return;
      
      if (!query || query.trim().length === 0) {
        resultsContainer.classList.add('hidden');
        return;
      }
      
      const q = query.toLowerCase();
      const filtered = customFoodDatabase.filter(f => f.name.toLowerCase().includes(q));
      
      if (filtered.length === 0) {
        resultsContainer.classList.add('hidden');
        return;
      }
      
      resultsContainer.innerHTML = filtered.map(item => `
        <div onclick="addFoodFromDatabase(${item.id})" style="padding: 12px 16px; border-bottom: 1px solid var(--card-border); cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;">

          <span style="color: var(--text-muted); font-size: 12px;">${item.kcal} ккал / 100г</span>
        </div>
      `).join('');
      
      resultsContainer.classList.remove('hidden');
    }

    function addFoodFromDatabase(id) {
      const food = customFoodDatabase.find(f => f.id === id);
      if (!food) return;
      
      const defaultWeight = 150; // Стандартная порция 150 грамм
      const factor = defaultWeight / 100;
      
      if (!todayData.meals[activeMealSubTab]) {
        todayData.meals[activeMealSubTab] = [];
      }
      
      todayData.meals[activeMealSubTab].push({
        name: food.name, 
        weight: defaultWeight,
        kcal: Math.round(food.kcal * factor),
        p: roundNum(food.p * factor), 
        f: roundNum(food.f * factor),
        c: roundNum(food.c * factor), 
        cu: roundNum(food.cu * factor, 1)
      });
      
      saveStateToLocalStorage();
      
      const searchInput = document.getElementById('foodSearchInput');
      if (searchInput) searchInput.value = '';
      
      const resultsContainer = document.getElementById('foodSearchResults');
      if (resultsContainer) resultsContainer.classList.add('hidden');
      
      renderApp();
    }

    // Обработка выбора изображения для ИИ-сканера с предварительным сжатием
    async function handleAiPhotoSelected(inputElement) {
      if (inputElement.files && inputElement.files[0]) {
        let file = inputElement.files[0];
        let reader = new FileReader();
        
        reader.onload = function(e) {
          let img = new Image();
          img.onload = function() {
            let canvas = document.createElement('canvas');
            let MAX_WIDTH = 800;
            let MAX_HEIGHT = 800;
            let width = img.width;
            let height = img.height;
            
            if (width > height) { 
              if (width > MAX_WIDTH) { 
                height *= MAX_WIDTH / width; 
                width = MAX_WIDTH; 
              } 
            } else { 
              if (height > MAX_HEIGHT) { 
                width *= MAX_HEIGHT / height; 
                height = MAX_HEIGHT; 
              } 
            }
            
            canvas.width = width; 
            canvas.height = height;
            
            let ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            // Получаем сжатый base64 JPEG
            let compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
            analyzeImageWithGemini(compressedDataUrl);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // Запрос к Google Gemini AI для анализа и распознавания пищевой ценности по фото
    async function analyzeImageWithGemini(base64Data) {
      if (!geminiApiKey || geminiApiKey.trim() === '') {
        const apiKeyErrorMsg = currentLang === 'ru' 
          ? "Пожалуйста, введите ваш Google Gemini API Key во вкладке 'Профиль'!" 
          : "Please enter your Google Gemini API Key in the 'Profile' tab!";
        alert(apiKeyErrorMsg);
        switchTab('profile');
        return;
      }

      const loadingIndicator = document.getElementById('aiLoadingIndicator');
      const resultBox = document.getElementById('aiResultBox');
      
      if (loadingIndicator) loadingIndicator.classList.remove('hidden');
      if (resultBox) resultBox.classList.add('hidden');

      let base64ImageBytes = base64Data.split(',')[1];
      let langInstruction = currentLang === 'ru' ? 'Russian' : (currentLang === 'nl' ? 'Dutch' : 'English');
      
      let promptText = `Analyze this food image in extreme detail. Return STRICT JSON format only (no markdown code blocks, no backticks, raw JSON string) with the exact keys: 
      - "name": string (descriptive food name in ${langInstruction})
      - "weight_g": number (estimated total weight in grams)
      - "calories": number (total kcal)
      - "proteins": number (grams)
      - "fats": number (grams)
      - "carbs": number (grams)
      - "carb_units": number (bread units, where 1 HE = 12g carbs)`;

      try {
        let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${geminiApiKey}`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify({ 
            contents: [{ 
              parts: [
                { text: promptText }, 
                { inline_data: { mime_type: "image/jpeg", data: base64ImageBytes } }
              ] 
            }],
            generationConfig: { 
              temperature: 0.2, 
              maxOutputTokens: 1024 
            }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        let data = await response.json();
        
        if (loadingIndicator) loadingIndicator.classList.add('hidden');

        if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
          throw new Error("Получен пустой ответ от нейросети Gemini.");
        }

        let candidatePart = data.candidates[0].content.parts[0].text;
        let cleanJsonText = candidatePart.replace(/```json/g, '').replace(/```/g, '').trim();
        
        let parsed = JSON.parse(cleanJsonText);

        // Безопасное заполнение полей результата
        const nameEl = document.getElementById('aiResName');
        const weightEl = document.getElementById('aiResWeight');
        const kcalEl = document.getElementById('aiResKcal');
        const protEl = document.getElementById('aiResProt');
        const fatsEl = document.getElementById('aiResFats');
        const carbsEl = document.getElementById('aiResCarbs');
        const cuEl = document.getElementById('aiResCU');

        if (nameEl) nameEl.innerText = parsed.name || "Meal";
        if (weightEl) weightEl.innerText = (parsed.weight_g || 250) + ' г';
        if (kcalEl) kcalEl.innerText = (parsed.calories || 350) + ' ккал';
        if (protEl) protEl.innerText = (parsed.proteins || 15) + ' г';
        if (fatsEl) fatsEl.innerText = (parsed.fats || 12) + ' г';
        if (carbsEl) carbsEl.innerText = (parsed.carbs || 30) + ' г';
        if (cuEl) cuEl.innerText = roundNum(parsed.carb_units || 2.5, 1);

        window.tempAiParsedFood = parsed;
        
        if (resultBox) {
          resultBox.classList.remove('hidden');
        }

      } catch (err) {
        if (loadingIndicator) {
          loadingIndicator.classList.add('hidden');
        }
        console.error("Gemini AI Analysis Error:", err);
        alert((currentLang === 'ru' ? "Ошибка при анализе изображения: " : "Error analyzing image: ") + err.message);
      }
    }

    function confirmAiFoodResult() {
      if (!window.tempAiParsedFood) return;
      let f = window.tempAiParsedFood;
      
      if (!todayData.meals[activeMealSubTab]) {
        todayData.meals[activeMealSubTab] = [];
      }
      
      todayData.meals[activeMealSubTab].push({
        name: f.name || "AI Meal", 
        weight: Number(f.weight_g) || 250,
        kcal: Number(f.calories) || 350, 
        p: Number(f.proteins) || 15,
        f: Number(f.fats) || 12, 
        c: Number(f.carbs) || 30, 
        cu: Number(f.carb_units) || 2.5
      });
      
      saveStateToLocalStorage();
      window.tempAiParsedFood = null;
      activeTab = 'diary';
      renderApp();
    }
    // ========================================================================== */
    // 7. MIFFLIN-ST JEOR CALCULATOR, WEIGHT TRACKER & CANVAS CHARTS MODULE        */
    // ========================================================================== */
    
    function calculateMifflinStJeor() {
      const heightInput = document.getElementById('calcHeight');
      const ageInput = document.getElementById('calcAge');
      const genderSelect = document.getElementById('calcGender');
      const activitySelect = document.getElementById('calcActivity');
      const goalSelect = document.getElementById('calcGoal');

      if (!heightInput || !ageInput || !genderSelect || !activitySelect || !goalSelect) return;

      const height = parseFloat(heightInput.value);
      const age = parseInt(ageInput.value);
      const gender = genderSelect.value;
      const activity = activitySelect.value;
      const goal = goalSelect.value;
      const weight = userProfile.weight;

      if (isNaN(height) || isNaN(age) || height <= 0 || age <= 0) {
        const errAlertMsg = currentLang === 'ru'
          ? "Пожалуйста, введите корректные числовые значения роста и возраста!"
          : (currentLang === 'nl' ? "Voer geldige lengte en leeftijd in!" : "Please enter valid numeric values for height and age!");
        alert(errAlertMsg);
        return;
      }

      // Расчет базового метаболизма (BMR) по формуле Миффлина - Сан Жеора
      let bmr = (10 * weight) + (6.25 * height) - (5 * age);
      if (gender === 'male') {
        bmr += 5;
      } else {
        bmr -= 161;
      }

      // Коэффициенты физической активности (PAL)
      const activityMultipliers = {
        min: 1.2,      // Сидячий образ жизни
        low: 1.375,    // Легкая активность (1-3 тренировки в неделю)
        moderate: 1.55,// Умеренная активность (3-5 тренировок в неделю)
        high: 1.725    // Высокая активность (6-7 тренировок в неделю)
      };
      
      let pal = activityMultipliers[activity] || 1.2;
      let tdee = bmr * pal;

      // Корректировка суточной нормы под поставленную цель
      let targetCalories = tdee;
      if (goal === 'lose') {
        targetCalories *= 0.85; // Безопасный дефицит 15% для похудения
      } else if (goal === 'gain') {
        targetCalories *= 1.15; // Профицит 15% для набора мышечной массы
      }

      targetCalories = Math.round(targetCalories);

      // Расчет целевых макронутриентов (БЖУ) в граммах
      let targetProtein = Math.round(weight * 1.8);
      let targetFat = Math.round(weight * 1.0);
      let remainingCaloriesForCarbs = targetCalories - (targetProtein * 4) - (targetFat * 9);
      let targetCarbs = Math.round(remainingCaloriesForCarbs / 4);
      
      if (targetCarbs < 100) targetCarbs = 100;

      // Обновление объекта пользовательского профиля
      userProfile.height = height;
      userProfile.age = age;
      userProfile.gender = gender;
      userProfile.activity = activity;
      userProfile.goal = goal;
      userProfile.targetCalories = targetCalories;
      userProfile.targetProtein = targetProtein;
      userProfile.targetFat = targetFat;
      userProfile.targetCarbs = targetCarbs;

      saveStateToLocalStorage();

      const successMsg = currentLang === 'ru'
        ? `Расчет успешно завершен! Новая суточная норма: ${targetCalories} ккал (Белки: ${targetProtein}г, Жиры: ${targetFat}г, Углеводы: ${targetCarbs}г).`
        : (currentLang === 'nl' ? `Berekening voltooid! Nieuw doel: ${targetCalories} kcal.` : `Calculation completed! New target: ${targetCalories} kcal.`);
      
      alert(successMsg);
      renderApp();
    }

    function logNewWeight() {
      const input = document.getElementById('quickWeightInput');
      if (!input) return;
      
      const val = parseFloat(input.value);
      if (!isNaN(val) && val > 20 && val < 300) {
        userProfile.weight = val;
        
        if (!todayData.weightHistory) {
          todayData.weightHistory = [];
        }
        
        const todayStr = getFormattedDate();
        const existingIndex = todayData.weightHistory.findIndex(h => h.date === todayStr);
        
        if (existingIndex >= 0) {
          todayData.weightHistory[existingIndex].weight = val;
        } else {
          todayData.weightHistory.push({ date: todayStr, weight: val });
        }

        // Хронологическая сортировка истории веса по дате
        todayData.weightHistory.sort((a, b) => new Date(a.date) - new Date(b.date));

        saveStateToLocalStorage();
        
        const successSaveMsg = currentLang === 'ru' ? "Вес успешно зафиксирован в истории!" : "Weight successfully logged!";
        alert(successSaveMsg);
        renderApp();
      } else {
        const errWeightMsg = currentLang === 'ru' ? "Введите корректное значение веса в кг!" : "Please enter a valid weight in kg!";
        alert(errWeightMsg);
      }
    }

    function renderWeightHistoryList() {
      const historyContainer = document.getElementById('weightHistoryList');
      if (!historyContainer) return;
      
      const history = todayData.weightHistory || [];
      if (history.length === 0) {
        const emptyHistoryText = currentLang === 'ru' ? "История измерений пока пуста" : "Weight history is empty";
        historyContainer.innerHTML = `<p style="color: var(--text-muted); font-size: 13px; text-align: center; padding: 10px 0;">${emptyHistoryText}</p>`;
        return;
      }

      historyContainer.innerHTML = history.slice(-7).reverse().map(h => `
        <div style="display: flex; justify-content: space-between; padding: 10px 4px; border-bottom: 1px solid var(--card-border); font-size: 14px; align-items: center;">
          <span style="color: var(--text-muted);">${h.date}</span>
          <strong style="color: var(--success); font-size: 15px;">${h.weight} кг</strong>
        </div>
      `).join('');
    }

    function drawWeightChart() {
      const canvas = document.getElementById('weightChartCanvas');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      const history = todayData.weightHistory || [];

      // Настройка размеров холста с учетом плотности пикселей Retina
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = 220 * dpr;
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = 220;

      ctx.clearRect(0, 0, width, height);

      if (history.length === 0) {
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(currentLang === 'ru' ? 'Нет данных для построения графика' : 'No chart data available', width / 2, height / 2);
        return;
      }

      const weights = history.map(h => h.weight);
      const minW = Math.min(...weights) - 1;
      const maxW = Math.max(...weights) + 1;
      const padding = 40;
      const chartWidth = width - padding * 2;
      const chartHeight = height - padding * 2;

      // Отрисовка фоновой сетки графика
      ctx.strokeStyle = '#374151';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        let y = padding + (chartHeight / 4) * i;
        ctx.moveTo(padding, y);
        ctx.lineTo(width - padding, y);
      }
      ctx.stroke();

      // Вычисление координат точек
      const points = history.map((item, index) => {
        let x = history.length === 1 ? width / 2 : padding + (chartWidth / (history.length - 1)) * index;
        let y = padding + chartHeight - ((item.weight - minW) / (maxW - minW || 1)) * chartHeight;
        return { x, y, weight: item.weight, date: item.date };
      });

      // Отрисовка линии тренда веса
      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 3;
      ctx.beginPath();
      points.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // Отрисовка вершин точек и подписей значений
      points.forEach(pt => {
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#f9fafb';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pt.weight + ' кг', pt.x, pt.y - 10);
      });
    }

    // ========================================================================== */
    // 8. PROFILE SETTINGS, BACKUP & APP INITIALIZATION MODULE                    */
    // ========================================================================== */
    
    function saveApiKeyFromUI() {
      const input = document.getElementById('geminiKeyInput');
      if (!input) return;
      
      geminiApiKey = input.value.trim();
      saveStateToLocalStorage();
      
      const successMsg = currentLang === 'ru' 
        ? "Google Gemini API Key успешно сохранен в защищенном хранилище браузера!" 
        : "Gemini API Key successfully saved!";
      alert(successMsg);
    }

    function changeLanguage(langCode) {
      if (!translations[langCode]) return;
      currentLang = langCode;
      saveStateToLocalStorage();
      renderApp();
    }

    function changeTheme(themeCode) {
      if (themeCode !== 'dark' && themeCode !== 'light') return;
      currentTheme = themeCode;
      applyTheme();
      saveStateToLocalStorage();
    }

    function exportAppDataAsJson() {
      const exportData = {
        profile: userProfile,
        today: todayData,
        customFoods: customFoodDatabase,
        exportDate: new Date().toISOString(),
        version: "2.5.0"
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `calories_pro_backup_${getFormattedDate()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function resetAllAppData() {
      const confirmMsg = currentLang === 'ru'
        ? "Внимание! Вы уверены, что хотите полностью сбросить все данные приложения, историю и настройки?"
        : "Warning! Are you sure you want to reset all app data and history?";
        
      if (confirm(confirmMsg)) {
        localStorage.clear();
        location.reload();
      }
    }

    function renderProfileExtended() {
      const container = document.getElementById('appViewContainer');
      if (!container) return;

      container.innerHTML = `
        <div class="card">
          <h2 class="card-title" style="margin-bottom: 20px;">${t('profile_title')}</h2>
          
          <label>${t('api_key_label')}</label>
          <input type="password" id="geminiKeyInput" value="${geminiApiKey}" placeholder="AIzaSy...">
          <button onclick="saveApiKeyFromUI()" style="width: 100%; margin-bottom: 20px;">${t('save_key')}</button>
          
          <label>${t('lang_label')}</label>
          <select id="langSelect" onchange="changeLanguage(this.value)">
            <option value="ru" ${currentLang==='ru'?'selected':''}>🇷🇺 Русский</option>
            <option value="en" ${currentLang==='en'?'selected':''}>🇬🇧 English</option>
            <option value="nl" ${currentLang==='nl'?'selected':''}>🇳🇱 Nederlands</option>
          </select>

          <label style="margin-top: 16px;">${t('theme_label')}</label>
          <select id="themeSelect" onchange="changeTheme(this.value)">
            <option value="dark" ${currentTheme==='dark'?'selected':''}>${t('theme_dark')}</option>
            <option value="light" ${currentTheme==='light'?'selected':''}>${t('theme_light')}</option>
          </select>
        </div>

        <div class="card">
          <h3 class="card-title" style="font-size: 18px; margin-bottom: 14px;">Управление данными</h3>
          <p class="card-subtitle" style="margin-bottom: 16px;">Вы можете выгрузить резервную копию ваших записей в файл или полностью сбросить прогресс.</p>
          <div style="display: flex; gap: 10px; flex-direction: column;">
            <button onclick="exportAppDataAsJson()" class="secondary" style="width: 100%;">💾 Экспортировать данные (JSON)</button>
            <button onclick="resetAllAppData()" class="danger" style="width: 100%;">⚠️ Сбросить все данные</button>
          </div>
        </div>
      `;
    }

    // Глобальный перехватчик переключения вкладок с поддержкой профиля
    const baseSwitchTab = window.switchTab || function(tab) { activeTab = tab; renderApp(); };
    window.switchTab = function(tabName) {
      activeTab = tabName;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(btn => {
        if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(tabName)) {
          btn.classList.add('active');
        }
      });

      if (tabName === 'profile') {
        renderProfileExtended();
      } else {
        renderApp();
      }
      window.scrollTo(0, 0);
    };

    // Стартовая инициализация при загрузке DOM
    window.addEventListener('DOMContentLoaded', () => {
      applyTheme();
      
      const lastActiveDate = localStorage.getItem('cp_active_date');
      const todayStr = getFormattedDate();
      if (lastActiveDate !== todayStr) {
        localStorage.setItem('cp_active_date', todayStr);
      }

      if (activeTab === 'profile') {
        renderProfileExtended();
      } else {
        renderApp();
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => {
          console.log('Service Worker registration skipped:', err);
        });
      }
    });

    // Закрытие модальных окон по клику вне области и клавише Escape
    window.addEventListener('click', (event) => {
      const modal = document.getElementById('manualAddModal');
      if (modal && event.target === modal) {
        closeManualModal();
      }
    });

    window.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        closeManualModal();
      }
    });
  </script>
