.mu{color:var(--mu);font-size:11px}.big{font-size:26px;font-weight:900}
.pill,.ib{background:var(--ca);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:6px 9px;font-size:12px;font-weight:700}
.pill{color:var(--ok)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px;font-size:14px;font-weight:800;width:100%}
.btn.pu{background:var(--pu)}.btn.gh{background:var(--ca);color:var(--tx);border:1px solid var(--bd)}.btn.dg{background:rgba(239,68,68,.15);color:var(--dg)}.btn.or{background:var(--wa)}
input,select{width:100%;padding:10px;background:var(--ca);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-size:15px;outline:0}
label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin:6px 0 3px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--ca);padding:4px;border-radius:12px}
.tabs button{background:none;border:0;color:var(--mu);padding:8px 2px;border-radius:9px;font-size:12px;font-weight:700}
.tabs button.on{background:var(--ac);color:#fff}
.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ok) var(--p),var(--bd) 0)}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-size:12px}
.mc{background:var(--ca);border:1px solid var(--bd);border-radius:12px;padding:7px 2px;text-align:center}
.mc b{display:block;font-size:12px}.bar{height:5px;border-radius:3px;background:var(--bd);margin:5px 6px 4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.fr{background:var(--ca);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fr .n{font-weight:700;font-size:13px}.x{background:rgba(239,68,68,.15);color:var(--dg);border:0;border-radius:7px;width:26px;height:26px;font-weight:800}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.mw{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:9px 16px;border-radius:20px;font-weight:700;z-index:99}
.hide{display:none}canvas{width:100%;height:170px;display:block}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function rollover(s){if(s.day===today())return;let k=0;M.forEach(m=>s.meals[m].forEach(i=>k+=i.k));if(k>0)s.log[s.day]=Math.round(k);
s.meals={breakfast:[],lunch:[],dinner:[],snacks:[]};s.water=0;s.act=0;s.day=today()}
function load(){try{const s={...def(),...JSON.parse(localStorage.getItem(KEY)||"{}")};M.forEach(m=>{if(!Array.isArray(s.meals[m]))s.meals[m]=[]});

const save=()=>{for(let n=0;n<40;n++){try{localStorage.setItem(KEY,JSON.stringify(A));return}catch(e){if(A.photos&&A.photos.length)A.photos.pop();else return}}};
const li=()=>["ru","en","nl"].indexOf(A.lang),t=k=>T[k][li()];
function toast(m){const e=document.createElement("div");e.className="ts";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}

function addFood(){const g=Math.max(1,num("pg",200)),f=g/100;let it;
if(custom){const n=($("#cn").value||"").trim()||"—";it={n:[n,n,n],g,k:Math.round(num("ck",0)*f),p:r1(num("cp",0)*f),f:r1(num("cfa",0)*f),c:r1(num("cc",0)*f)}}
else{const d=DB[sel];it={n:[d[0],d[1],d[2]],g,k:Math.round(d[3]*f),p:r1(d[4]*f),f:r1(d[5]*f),c:r1(d[6]*f)}}
A.meals[A.meal].push(it);save();closeM();render()}
function actModal(){openM(`<div class="row"><b>🏃 ${t("act")}</b><button class="x" onclick="closeM()">✕</button></div>
${AC.map(a=>`<div class="fr" style="cursor:pointer" onclick="addAct(${a[3]})"><span class="n">${a[li()]}</span><b style="color:var(--wa)">+${a[3]}</b></div>`).join("")}
<label>${t("other")}</label><div class="row"><input id="ac" type="number" inputmode="numeric" placeholder="300"><button class="pill" style="white-space:nowrap" onclick="addAct(num('ac',0))">+</button></div>`)}
function addAct(k){if(k>0){A.act+=Math.round(k);save();closeM();render()}}
function shrink(file,max){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=()=>no(new Error("read"));r.onload=e=>{const im=new Image();im.onerror=()=>no(new Error("decode"));
im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};im.src=e.target.result};r.readAsDataURL(file)})}
function aiModal(){ai=null;openM(`<div class="row"><b>${t("ai")}</b><button class="x" onclick="closeM()">✕</button></div>
<label>${t("key")}</label><div class="row"><input id="k" type="password" value="${esc(A.key)}" placeholder="AIza..."><button class="pill" onclick="A.key=$('#k').value.trim();save();toast(t('saved'))">OK</button></div><div class="mu">${t("autoKey")}</div>
<label>${t("photo")}</label><input type="file" accept="image/*" onchange="scan(this)"><div id="al" class="hide" style="text-align:center;color:var(--ac);font-weight:700">${t("scan")}</div>
<div id="ar" class="hide card" style="background:var(--ca)"><b id="an" style="color:var(--ok)"></b><div id="am" class="mu" style="margin:4px 0"></div><label>${t("portion")}</label><input id="ag" type="number" inputmode="decimal" oninput="showAi(Math.max(1,parseFloat(this.value)||1))"></div>
<div class="grid g2"><button class="btn gh" onclick="closeM()">${t("cancel")}</button><button id="ab" class="btn pu hide" onclick="aiAdd()">${t("addD")}</button></div>`)}
async function callG(key,b64,think){const gc={temperature:.2,maxOutputTokens:4096,responseMimeType:"application/json"};if(think)gc.thinkingConfig={thinkingBudget:0};
const L={ru:"Russian",en:"English",nl:"Dutch"}[A.lang];
const pr=`Analyze this food photo. Return JSON: {"name": dish name in ${L}, "weight_g": number, "calories": number, "proteins": number, "fats": number, "carbs": number}. Values are for the whole portion shown. If there is no food, return {"error":"no_food"}.`;
return fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{parts:[{text:pr},{inline_data:{mime_type:"image/jpeg",data:b64}}]}],generationConfig:gc})})}
async function scan(inp){if(!inp.files[0])return;const key=$("#k").value.trim();if(!key){alert(t("nokey"));return}A.key=key;save();
$("#al").classList.remove("hide");$("#ar").classList.add("hide");$("#ab").classList.add("hide");
try{const b64=(await shrink(inp.files[0],768)).split(",")[1];let r=await callG(key,b64,true);if(r.status==400)r=await callG(key,b64,false);
if(!r.ok){let m="HTTP "+r.status;try{const e=await r.json();if(e.error&&e.error.message)m+=": "+e.error.message}catch(_){}throw new Error(m)}
const d=await r.json(),parts=d.candidates&&d.candidates[0]&&d.candidates[0].content&&d.candidates[0].content.parts;if(!parts)throw new Error("empty response");
let o=JSON.parse(parts.map(p=>p.text||"").join("").replace(/```json|```/g,"").trim());if(Array.isArray(o))o=o[0];
if(!o||o.error){$("#al").classList.add("hide");alert(t("nofood"));return}
ai={n:String(o.name||"?"),g:Math.max(1,Number(o.weight_g)||250),k:Number(o.calories)||0,p:Number(o.proteins)||0,f:Number(o.fats)||0,c:Number(o.carbs)||0};
$("#ag").value=ai.g;$("#al").classList.add("hide");$("#ar").classList.remove("hide");$("#ab").classList.remove("hide");showAi(ai.g)}
catch(e){$("#al").classList.add("hide");alert(t("err")+e.message)}}
function showAi(g){const f=g/ai.g;ai.cur={n:[ai.n,ai.n,ai.n],g,k:Math.round(ai.k*f),p:r1(ai.p*f),f:r1(ai.f*f),c:r1(ai.c*f)};$("#an").textContent=ai.n;
$("#am").textContent=`${g}${t("g")} · ${ai.cur.k} ${t("kcal")} · ${t("p")[0]}${ai.cur.p} ${t("f")[0]}${ai.cur.f} ${t("c")[0]}${ai.cur.c}`}
function aiAdd(){if(!ai||!ai.cur)return;A.meals[A.meal].push(ai.cur);ai=null;save();closeM();render()}
function bmiOf(){const h=A.height/100;return A.weight/(h*h)}
function formWeight(){const b=bmiOf(),st=b<18.5?["--wa","↓"]:b<25?["--ok","✓"]:b<30?["--wa","↑"]:["--dg","↑↑"];
return`<div class="card"><div class="row"><b>${t("bmi")}: ${r1(b)}</b><span class="pill" style="color:var(${st[0]})">${st[1]}</span></div>
<div class="grid g4" style="margin:10px 0"><div class="mc"><span class="mu">${t("start")}</span><b>${A.startW}</b></div><div class="mc"><span class="mu">${t("weight")}</span><b style="color:var(--ac)">${A.weight}</b></div><div class="mc"><span class="mu">${t("target")}</span><b style="color:var(--ok)">${A.target}</b></div><div class="mc"><span class="mu">${t("height")}</span><b>${A.height}</b></div></div>
<label>${t("startw")}</label><input id="sw" type="number" inputmode="decimal" step="0.1" value="${A.startW}"><label>${t("weight")}</label><input id="w" type="number" inputmode="decimal" step="0.1" value="${A.weight}"><label>${t("target")}</label><input id="tw" type="number" inputmode="decimal" step="0.1" value="${A.target}">
<label>${t("height")}</label><input id="h" type="number" inputmode="numeric" value="${A.height}"><button class="btn" style="margin-top:12px" onclick="saveWeight()">${t("save")}</button></div>`}
function saveWeight(){const sw=num("sw",0);if(sw>30&&sw<350)A.startW=sw;const w=num("w",0),h=num("h",0),tw=num("tw",0);if(w>30&&w<350)A.weight=w;if(h>100&&h<250)A.height=Math.round(h);if(tw>30&&tw<350)A.target=tw;
const e=A.hist.find(x=>x.d===today());if(e)e.w=A.weight;else A.hist.push({d:today(),w:A.weight});A.hist.sort((a,b)=>a.d.localeCompare(b.d));if(!A.manual)calc();save();render();toast(t("saved"))}
function series(m){if(m=="days")return A.hist.slice(-10);const g={};A.hist.forEach(h=>{let k;if(m=="months")k=h.d.slice(0,7);else{const d=new Date(h.d+"T00:00:00");d.setDate(d.getDate()-(d.getDay()+6)%7);k=d.toISOString().slice(0,10)}(g[k]=g[k]||[]).push(h.w)});
return Object.keys(g).sort().slice(-8).map(k=>({d:k,w:r1(g[k].reduce((a,b)=>a+b,0)/g[k].length)}))}
function setPeriod(p){A.period=p;save();render()}
function charts(){const lg=Object.values(A.log),avg=lg.length?Math.round(lg.reduce((a,b)=>a+b,0)/lg.length):"—",ch=r1(A.weight-A.startW);
const sc=(n,v,c)=>`<div class="mc" style="padding:10px"><span class="mu">${n}</span><b style="font-size:16px;color:${c}">${v}</b></div>`;
return`<div class="card"><div class="tabs">${["days","weeks","months"].map(p=>`<button class="${A.period==p?"on":""}" onclick="setPeriod('${p}')">${t(p)}</button>`).join("")}</div><canvas id="cv" style="margin-top:10px"></canvas></div>
<div class="grid g2">${sc(t("avg"),avg+" "+(avg=="—"?"":t("kcal")),"var(--ac)")}${sc(t("chg"),(ch>0?"+":"")+ch+" kg",ch<=0?"var(--ok)":"var(--dg)")}${sc(t("water"),Math.round(A.water/Math.max(1,A.waterG)*100)+"%","var(--ac)")}${sc(t("bmi"),r1(bmiOf()),"var(--ok)")}</div>`}
function draw(){const c=$("#cv");if(!c)return;const dpr=devicePixelRatio||1,W=c.clientWidth,H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
const D=series(A.period),dk=A.theme=="dark";x.font="11px sans-serif";x.textAlign="center";if(!D.length)return;
const ws=D.map(o=>o.w),mn=Math.min(...ws)-1,mx=Math.max(...ws)+1,pd=30;
const P=D.map((o,i)=>({x:D.length==1?W/2:pd+(W-2*pd)*i/(D.length-1),y:H-pd-(o.w-mn)/(mx-mn)*(H-2*pd),w:o.w,d:o.d}));
x.strokeStyle="#3b82f6";x.lineWidth=3;x.beginPath();P.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.stroke();
P.forEach((p,i)=>{x.fillStyle="#3b82f6";x.beginPath();x.arc(p.x,p.y,4,0,7);x.fill();x.fillStyle=dk?"#f8fafc":"#0f172a";x.fillText(p.w,p.x,p.y-9);if(P.length<=5||i==0||i==P.length-1)x.fillText(p.d.slice(5),p.x,H-8)})}
function saveBio(){A.gender=$("#pg2").value;A.age=Math.round(num("pa",A.age));A.mult=parseFloat($("#pm").value);A.manual=false;calc();save();render();toast(t("saved"))}
function saveTargets(){A.kcalG=Math.round(num("tk",A.kcalG));A.waterG=Math.round(num("tw2",A.waterG));A.pG=Math.round(num("tp",A.pG));A.fG=Math.round(num("tf",A.fG));A.cG=Math.round(num("tc",A.cG));A.manual=true;save();render();toast(t("saved"))}
function clearDay(){if(confirm(t("confirm"))){A.meals={breakfast:[],lunch:[],dinner:[],snacks:[]};A.water=0;A.act=0;save();render()}}
function backup(){const a=document.createElement("a");a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(A,null,2));a.download="dietapro_"+today()+".json";document.body.appendChild(a);a.click();a.remove()}
function factory(){if(confirm(t("confirm"))){localStorage.removeItem(KEY);location.reload()}}
const RP={normal:[[0,220],[3,300],[4,250],[5,160]],veg:[[2,250],[8,300],[9,320],[10,150]],diab:[[5,200],[12,280],[13,260],[6,180]]};
function setRt(k){A.rt=k;save();render()}
function ration(){const p=RP[A.rt];return`<div class="card"><div class="tabs">${["normal","veg","diab"].map(k=>`<button class="${A.rt==k?"on":""}" onclick="setRt('${k}')">${t("r"+k)}</button>`).join("")}</div>
<p class="mu" style="margin:10px 0">${t("rd"+A.rt)}</p><div class="grid">${p.map(([i,g],x)=>{const d=DB[i],f=g/100;return`<div class="fr"><div><div class="mu" style="color:var(--ac)">${t(M[x])}</div><div class="n">${esc(d[li()])}</div><div class="mu">${g}${t("g")} · ${t("p")[0]}${r1(d[4]*f)} ${t("f")[0]}${r1(d[5]*f)} ${t("c")[0]}${r1(d[6]*f)}</div></div><b style="color:var(--ac)">${Math.round(d[3]*f)}</b></div>`}).join("")}</div>
<button class="btn" style="margin-top:12px" onclick="loadRt()">${t("rload")}</button></div>`}
function loadRt(){RP[A.rt].forEach(([i,g],x)=>{const d=DB[i],f=g/100;A.meals[M[x]].push({n:[d[0],d[1],d[2]],g,k:Math.round(d[3]*f),p:r1(d[4]*f),f:r1(d[5]*f),c:r1(d[6]*f)})});save();A.tab="diary";render();toast(t("rloaded"))}
function setFt(k){A.ftab=k;save();render()}
function formTab(){const ks=[["weight","fw"],["measures","fm"],["photos","fp"]];
return`<div class="tabs">${ks.map(([k,n])=>`<button class="${A.ftab==k?"on":""}" onclick="setFt('${k}')">${t(n)}</button>`).join("")}</div>`+(A.ftab=="measures"?formMeas():A.ftab=="photos"?formPhotos():formWeight())}
const MK=["waist","chest","hips","bicep","neck","thigh"];
function formMeas(){return`<div class="card"><div class="grid g2">${MK.map(k=>`<div><label>${t(k)}</label><input id="m_${k}" type="number" inputmode="decimal" step="0.5" value="${A.meas[k]||""}"></div>`).join("")}</div><button class="btn" style="margin-top:12px" onclick="saveMeas()">${t("save")}</button></div>`}
function saveMeas(){MK.forEach(k=>{const v=num("m_"+k,0);if(v>0)A.meas[k]=v});save();toast(t("saved"))}
function formPhotos(){return`<div class="card"><label class="btn pu" style="display:block;text-align:center;margin:0">${t("newphoto")}<input type="file" accept="image/*" style="display:none" onchange="addPhoto(this)"></label>
<div class="grid g2" style="margin-top:10px">${A.photos.length?A.photos.map(p=>`<div class="fr" style="flex-direction:column;align-items:stretch;padding:0;overflow:hidden"><img src="${p.u}" style="width:100%;height:130px;object-fit:cover"><div class="row" style="padding:5px 8px"><span class="mu">${p.d} · ${p.w}kg</span><button class="x" onclick="delPhoto(${p.id})">✕</button></div></div>`).join(""):`<div class="mu" style="grid-column:span 2;text-align:center;padding:14px">${t("nophoto")}</div>`}</div></div>`}
async function addPhoto(inp){if(!inp.files[0])return;try{const u=await shrink(inp.files[0],640);A.photos.unshift({id:Date.now(),d:today(),w:A.weight,u});save();render();toast(t("saved"))}catch(e){alert(e.message)}}
function delPhoto(id){A.photos=A.photos.filter(p=>p.id!==id);save();render()}
function profile(){const mo=[[1.2,"m1"],[1.375,"m2"],[1.55,"m3"],[1.725,"m4"]];
return`<div class="card"><div class="grid g2"><div><label>${t("gender")}</label><select id="pg2"><option value="male" ${A.gender=="male"?"selected":""}>${t("male")}</option><option value="female" ${A.gender=="female"?"selected":""}>${t("female")}</option></select></div>
<div><label>${t("age")}</label><input id="pa" type="number" inputmode="numeric" value="${A.age}"></div></div><label>${t("mult")}</label><select id="pm">${mo.map(m=>`<option value="${m[0]}" ${A.mult==m[0]?"selected":""}>${t(m[1])}</option>`).join("")}</select>
<button class="btn" style="margin-top:10px" onclick="saveBio()">${t("calc")}</button></div>
<div class="card"><div class="grid g2"><div><label>${t("kcalG")}</label><input id="tk" type="number" inputmode="numeric" value="${A.kcalG}"></div><div><label>${t("waterG")}</label><input id="tw2" type="number" inputmode="numeric" value="${A.waterG}"></div></div>
<div class="grid g3"><div><label>${t("p")}</label><input id="tp" type="number" inputmode="numeric" value="${A.pG}"></div><div><label>${t("f")}</label><input id="tf" type="number" inputmode="numeric" value="${A.fG}"></div><div><label>${t("c")}</label><input id="tc" type="number" inputmode="numeric" value="${A.cG}"></div></div>
<button class="btn" style="margin-top:10px" onclick="saveTargets()">${t("save")}</button></div>
<div class="card"><label>${t("key")}</label><div class="row"><input id="pk" type="password" value="${esc(A.key)}" placeholder="AIza..."><button class="pill" onclick="A.key=$('#pk').value.trim();save();toast(t('saved'))">OK</button></div><div class="mu">${t("autoKey")}</div></div>
<div class="grid"><button class="btn gh" onclick="clearDay()">${t("clear")}</button><button class="btn gh" onclick="backup()">${t("backup")}</button><button class="btn dg" onclick="factory()">${t("reset")}</button></div>`}
function render(){document.documentElement.setAttribute("data-theme",A.theme);
$("#hd").innerHTML=`<div><b style="font-size:16px">🔥 Dieta Pro</b></div><div class="ra"><button class="pill" onclick="cycleGoal()">${t(A.goal)}</button><button class="ib" onclick="theme()">${A.theme=="dark"?"🌙":"☀️"}</button><button class="ib" onclick="lang()">🌐 ${A.lang.toUpperCase()}</button></div>`;
const tabs=[["diary","🍏"],["ration","🥗"],["form","⚖️"],["charts","📊"],["prof","⚙️"]];
$("#nv").innerHTML=tabs.map(([k,i])=>`<button class="${A.tab==k?"on":""}" onclick="go('${k}')"><i>${i}</i>${t(k)}</button>`).join("");
$("#mn").innerHTML=A.tab=="diary"?diary():A.tab=="ration"?ration():A.tab=="form"?formTab():A.tab=="charts"?charts():profile();
if(A.tab=="charts")requestAnimationFrame(draw)}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&A.day!==today()){rollover(A);save();render()}});
render();
</script></body></html>
