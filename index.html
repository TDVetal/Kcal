  <style>
    /* ========================================================================== */
    /* 1. DESIGN TOKENS & ADVANCED CSS CUSTOM PROPERTIES (DARK / LIGHT THEMES)    */
    /* ========================================================================== */
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --card-bg-alt: #1a233a;
      --card-border: #24304d;
      --text-color: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-light: rgba(59, 130, 246, 0.15);
      --purple-accent: #9333ea;
      --purple-hover: #7e22ce;
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --warning-light: rgba(245, 158, 11, 0.15);
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
    }

    [data-theme="light"] {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --card-bg-alt: #f9fafb;
      --card-border: #e5e7eb;
      --text-color: #111827;
      --text-muted: #6b7280;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    /* ========================================================================== */
    /* 2. GLOBAL RESET & BASE ENTERPRISE STYLING                                  */
    /* ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 110px;
      padding-top: env(safe-area-inset-top);
      transition: var(--transition);
      overflow-x: hidden;
      min-height: 100%;
      line-height: 1.5;
    }

    /* Professional Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .hidden { display: none !important; }
    .container { max-width: 620px; margin: 0 auto; padding: 16px; }

    /* ========================================================================== */
    /* 3. CARD COMPONENTS & TOP NAVIGATION BAR STYLING                            */
    /* ========================================================================== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 12px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
    }
    .app-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--text-color); }
    .top-controls { display: flex; align-items: center; gap: 8px; }
    .badge-goal { background: rgba(16, 185, 129, 0.15); color: var(--success); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .icon-btn { background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-color); padding: 6px 12px; border-radius: 16px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: var(--transition); }
    .icon-btn:hover { background: var(--card-border); }

    .card {
      background-color: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 20px;
      margin-bottom: 14px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
    }

    /* ========================================================================== */
    /* 4. CALORIES & MACRO NUTRIENTS ANALYTICS WIDGETS                            */
    /* ========================================================================== */
    .calories-main-card { display: flex; justify-content: space-between; align-items: center; }
    .cal-numbers h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; color: var(--text-color); }
    .cal-numbers h1 span { font-size: 16px; font-weight: 400; color: var(--text-muted); }
    .cal-left-badge { display: inline-block; background: rgba(16, 185, 129, 0.15); color: var(--success); padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-top: 6px; }
    
    .progress-ring { width: 68px; height: 68px; border-radius: 50%; background: conic-gradient(var(--success) var(--p, 0%), var(--card-border) 0%); display: flex; align-items: center; justify-content: center; position: relative; }
    .progress-ring::before { content: attr(data-progress); position: absolute; width: 54px; height: 54px; background: var(--card-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-color); }

    .macros-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .macro-box { background: var(--card-bg-alt); padding: 12px 6px; border-radius: var(--radius-sm); text-align: center; border: 1px solid var(--card-border); }
    .macro-box.sugar { border-color: rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.05); }
    .macro-box .m-title { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; text-transform: uppercase; }
    .macro-box .m-val { font-size: 13px; font-weight: 700; color: var(--text-color); }
    .macro-circle { width: 34px; height: 34px; border-radius: 50%; margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border: 2px solid var(--card-border); }

    /* ========================================================================== */
    /* 5. WATER & ACTIVITY INTERACTIVE WIDGETS                                    */
    /* ========================================================================== */
    .widgets-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .widget-box { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow); }
    .widget-title { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; }
    .widget-controls { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
    .water-val { font-size: 15px; font-weight: 700; color: var(--text-color); }
    .mini-btns { display: flex; gap: 6px; }
    .mini-btn { background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-color); width: 30px; height: 30px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
    .mini-btn:hover { background: var(--card-border); }
    .activity-btn { background: #f97316; color: white; border: none; padding: 6px 14px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 4px; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3); }

    /* ========================================================================== */
    /* 6. MEAL TABS, FOOD ITEMS & ACTION BUTTONS                                  */
    /* ========================================================================== */
    .meal-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
    .meal-tab { background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: var(--transition); }
    .meal-tab.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

    .meal-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
    .food-item-card { background: var(--card-bg-alt); border: 1px solid var(--card-border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: var(--transition); }
    .food-item-card:hover { border-color: var(--accent); }
    .food-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; color: var(--text-color); }
    .food-details { font-size: 12px; color: var(--text-muted); }
    .food-right { display: flex; align-items: center; gap: 12px; }
    .food-kcal { font-size: 15px; font-weight: 700; color: var(--accent); }
    .del-btn { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: none; width: 26px; height: 26px; border-radius: 8px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }

    .action-buttons-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 16px; }
    .btn-primary { background: var(--accent); color: white; border: none; padding: 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ai { background: var(--purple-accent); color: white; border: none; padding: 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3); }

    /* ========================================================================== */
    /* 7. BOTTOM NAVIGATION BAR & FORM CONTROLS                                   */
    /* ========================================================================== */
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.4); }
    .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 500; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; padding: 6px 12px; border-radius: 10px; transition: var(--transition); }
    .nav-item.active { color: var(--accent); background: var(--accent-light); }
    .nav-item span { font-size: 18px; }

    .form-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .weight-box { background: var(--card-bg-alt); border: 1px solid var(--card-border); padding: 14px 10px; border-radius: var(--radius-sm); text-align: center; }
    .weight-box .wb-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .weight-box .wb-val { font-size: 16px; font-weight: 700; margin-top: 4px; color: var(--text-color); }
    
    input, select { width: 100%; padding: 14px; background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-color); border-radius: var(--radius-sm); margin-bottom: 12px; font-size: 15px; }
    input:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
    label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 500; }
    
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 16px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 20px; width: 100%; max-width: 480px; box-shadow: var(--shadow); }
  </style>
</head>
<body>

  <div class="container" id="appContainer"></div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="switchTab('diary')"><span>🍏</span>Дневник</button>
    <button class="nav-item" onclick="switchTab('ration')"><span>🥗</span>Рацион</button>
    <button class="nav-item" onclick="switchTab('form')"><span>📏</span>Форма</button>
    <button class="nav-item" onclick="switchTab('charts')"><span>📊</span>Графики</button>
    <button class="nav-item" onclick="switchTab('profile')"><span>⚙️</span>Профиль</button>
  </nav>

  <script>
    // 1. Расширенный мультиязычный словарь интерфейса
    const translations = {
      ru: {
        diary: "Дневник", ration: "Рацион", form: "Форма", charts: "Графики", profile: "Профиль",
        goal: "Похудение", breakfast: "Завтрак", lunch: "Обед", dinner: "Ужин", snacks: "Перекус",
        consumed: "Съедено", goal_cal: "Цель", remaining: "Осталось", water: "ВОДА", activity: "АКТИВНОСТЬ",
        proteins: "Белки", fats: "Жиры", carbs: "Углеводы", sugar_xe: "Сахар / ХЕ", add_food: "+ Добавить еду", ai_photo: "📸 ИИ Фото"
      },
      en: {
        diary: "Diary", ration: "Ration", form: "Form", charts: "Charts", profile: "Profile",
        goal: "Fat Loss", breakfast: "Breakfast", lunch: "Lunch", dinner: "Dinner", snacks: "Snacks",
        consumed: "Consumed", goal_cal: "Goal", remaining: "Remaining", water: "WATER", activity: "ACTIVITY",
        proteins: "Proteins", fats: "Fats", carbs: "Carbs", sugar_xe: "Sugar / CU", add_food: "+ Add Food", ai_photo: "📸 AI Photo"
      },
      nl: {
        diary: "Dagboek", ration: "Dieet", form: "Vorm", charts: "Grafieken", profile: "Profiel",
        goal: "Afvallen", breakfast: "Ontbijt", lunch: "Lunch", dinner: "Diner", snacks: "Snack",
        consumed: "Gegeten", goal_cal: "Doel", remaining: "Over", water: "WATER", activity: "ACTIVITEIT",
        proteins: "Eiwitten", fats: "Vetten", carbs: "Koolhydraten", sugar_xe: "Suiker / KH", add_food: "+ Eten toevoegen", ai_photo: "📸 AI Foto"
      }
    };

    // 2. База продуктов по умолчанию
    const defaultFoodDatabase = [
      { id: 1, name: "Омлет с сыром и томатами", kcal: 180, p: 12, f: 14, c: 3, cu: 0.2 },
      { id: 2, name: "Овсяная каша на воде", kcal: 88, p: 3.0, f: 1.7, c: 15.0, cu: 1.2 },
      { id: 3, name: "Куриная грудка отварная", kcal: 165, p: 31.0, f: 3.6, c: 0.0, cu: 0.0 },
      { id: 4, name: "Тост с авокадо и яйцом", kcal: 220, p: 8.5, f: 14.0, c: 15.0, cu: 1.3 },
      { id: 5, name: "Творог 5%", kcal: 121, p: 16.5, f: 5.0, c: 2.0, cu: 0.2 },
      { id: 6, name: "Лосось запеченный", kcal: 206, p: 22.1, f: 12.4, c: 0.0, cu: 0.0 }
    ];

    // 3. Глобальное состояние приложения
    let state = JSON.parse(localStorage.getItem('cp_state_enterprise')) || {
      lang: 'ru',
      theme: 'dark',
      weight: 115,
      startWeight: 82,
      targetWeight: 100,
      height: 185,
      age: 41,
      gender: 'male',
      activityMultiplier: 1.375,
      goal: 'Похудение',
      caloriesGoal: 2496,
      water: 1000,
      waterGoal: 2000,
      activityKcal: 570,
      activeTab: 'diary',
      activeMeal: 'Завтрак',
      apiKey: '',
      meals: {
        'Завтрак': [
          { name: "Омлет с сыром, томатами и зеленью", weight: 220, p: 20, f: 24, c: 5, cu: 0.4, kcal: 310 },
          { name: "Лосось запеченный", weight: 160, p: 31, f: 20, c: 20, cu: 0.0, kcal: 320 }
        ],
        'Обед': [],
        'Ужин': [],
        'Перекус': []
      },
      bodyMeasurements: { waist: 84, chest: 102, hips: 98, bicep: 38 },
      weightHistory: [
        { date: '2026-09-20', weight: 78.5 },
        { date: '2026-10-16', weight: 115 }
      ],
      progressPhotos: []
    };
    // ========================================================================== */
    // 8. ENTERPRISE STATE MANAGEMENT & DATA PERSISTENCE SUBSYSTEM                */
    // ========================================================================== */
    
    const STORAGE_KEY = 'cp_state_enterprise_v3';

    function loadStateFromStorage() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return null;
        const parsed = JSON.parse(saved);
        // Валидация базовой структуры состояния
        if (!parsed || typeof parsed !== 'object') return null;
        return parsed;
      } catch (err) {
        console.error("Critical error reading state from localStorage:", err);
        return null;
      }
    }

    let state = loadStateFromStorage() || {
      lang: 'ru',
      theme: 'dark',
      weight: 115.0,
      startWeight: 82.0,
      targetWeight: 100.0,
      height: 185,
      age: 41,
      gender: 'male',
      activityMultiplier: 1.375,
      goal: 'Похудение',
      caloriesGoal: 2496,
      water: 1000,
      waterGoal: 2000,
      activityKcal: 570,
      activeTab: 'diary',
      activeMeal: 'Завтрак',
      apiKey: '',
      meals: {
        'Завтрак': [
          { id: 101, name: "Омлет с сыром, томатами и зеленью", weight: 220, p: 20, f: 24, c: 5, cu: 0.4, kcal: 310 },
          { id: 102, name: "Лосось запеченный", weight: 160, p: 31, f: 20, c: 20, cu: 0.0, kcal: 320 }
        ],
        'Обед': [],
        'Ужин': [],
        'Перекус': []
      },
      bodyMeasurements: { waist: 84, chest: 102, hips: 98, bicep: 38 },
      weightHistory: [
        { date: '2026-09-20', weight: 78.5 },
        { date: '2026-10-16', weight: 115.0 }
      ],
      progressPhotos: [],
      customFoodDatabase: [...defaultFoodDatabase]
    };

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error("Critical error writing state to localStorage:", err);
        alert("Ошибка сохранения данных в память браузера. Возможно, превышен лимит хранилища.");
      }
    }

    // ========================================================================== */
    // 9. NAVIGATION & THEME CONTROLLER SUBSYSTEM                                 */
    // ========================================================================== */

    function switchTab(tabName) {
      const validTabs = ['diary', 'ration', 'form', 'charts', 'profile'];
      if (!validTabs.includes(tabName)) return;

      state.activeTab = tabName;
      saveState();

      document.querySelectorAll('.nav-item').forEach((el, idx) => {
        if (validTabs[idx] === tabName) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyThemeToDOM();
      saveState();
      render();
    }

    function applyThemeToDOM() {
      if (state.theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    }

    function toggleLang() {
      if (state.lang === 'ru') state.lang = 'en';
      else if (state.lang === 'en') state.lang = 'nl';
      else state.lang = 'ru';
      
      saveState();
      render();
    }

    // ========================================================================== */
    // 10. METABOLIC CALCULATOR (MIFFLIN - ST JEOR) & BODY METRICS                */
    // ========================================================================== */

    function calculateBMI() {
      if (!state.height || state.height <= 0) return "0.0";
      let heightInMeters = state.height / 100;
      let bmiValue = state.weight / (heightInMeters * heightInMeters);
      return bmiValue.toFixed(1);
    }

    function calculateMifflinStJeor() {
      // Формула Миффлина — Сан-Жеора для расчета базового метаболизма (BMR)
      let bmr = (10 * Number(state.weight)) + (6.25 * Number(state.height)) - (5 * Number(state.age));
      
      if (state.gender === 'male') {
        bmr += 5;
      } else {
        bmr -= 161;
      }

      // Умножение на коэффициент физической активности (PAL)
      let tdee = bmr * Number(state.activityMultiplier);

      // Корректировка под цель пользователя
      if (state.goal === 'Похудение' || state.goal === 'Fat Loss' || state.goal === 'Afvallen') {
        tdee *= 0.85; // Безопасный дефицит 15%
      } else if (state.goal === 'Набор' || state.goal === 'Muscle Gain' || state.goal === 'Spieropbouw') {
        tdee *= 1.15; // Профицит 15%
      }

      state.caloriesGoal = Math.round(tdee);
      saveState();

      let successMsg = state.lang === 'ru' 
        ? `Норма калорий успешно пересчитана: ${state.caloriesGoal} ккал` 
        : `Calorie target successfully updated: ${state.caloriesGoal} kcal`;
      
      alert(successMsg);
      render();
    }

    // ========================================================================== */
    // 11. NUTRITIONAL CALCULATIONS & DATA MUTATORS                               */
    // ========================================================================== */

    function changeWater(delta) {
      state.water = Math.max(0, state.water + delta);
      saveState();
      render();
    }

    function getMealKcal(mealName) {
      if (!state.meals[mealName]) return 0;
      return state.meals[mealName].reduce((acc, item) => acc + (Number(item.kcal) || 0), 0);
    }

    function getMealCU(mealName) {
      if (!state.meals[mealName]) return 0.0;
      let sum = state.meals[mealName].reduce((acc, item) => acc + (Number(item.cu) || 0), 0);
      return Math.round(sum * 10) / 10;
    }

    function removeFoodItem(mealName, index) {
      if (state.meals[mealName] && state.meals[mealName][index]) {
        state.meals[mealName].splice(index, 1);
        saveState();
        render();
      }
    }

    function addSampleFoodToActiveMeal() {
      if (!state.meals[state.activeMeal]) {
        state.meals[state.activeMeal] = [];
      }

      const sampleItems = [
        { name: "Классический завтрак: Тост с авокадо и яйцом", weight: 250, p: 16, f: 22, c: 26, cu: 2.1, kcal: 380 },
        { name: "Овсяная каша с орехами и медом", weight: 280, p: 10, f: 9, c: 45, cu: 3.5, kcal: 290 },
        { name: "Куриная грудка с бурым рисом", weight: 320, p: 42, f: 6, c: 38, cu: 3.1, kcal: 390 }
      ];

      let randomItem = sampleItems[Math.floor(Math.random() * sampleItems.length)];
      state.meals[state.activeMeal].push({ ...randomItem, id: Date.now() });

      saveState();
      render();
    }

    function recordNewWeight() {
      let inputElement = document.getElementById('newWeightInput');
      if (!inputElement) return;

      let val = parseFloat(inputElement.value);
      if (isNaN(val) || val <= 0 || val > 400) {
        alert(state.lang === 'ru' ? "Введите корректный вес!" : "Please enter a valid weight!");
        return;
      }

      state.weight = val;
      let todayStr = new Date().toISOString().split('T')[0];
      
      // Проверка на существующую запись за сегодня
      let existingIndex = state.weightHistory.findIndex(h => h.date === todayStr);
      if (existingIndex >= 0) {
        state.weightHistory[existingIndex].weight = val;
      } else {
        state.weightHistory.unshift({ date: todayStr, weight: val });
      }

      saveState();
      render();
      alert(state.lang === 'ru' ? "Вес успешно зафиксирован!" : "Weight successfully recorded!");
    }

    function saveBodyMeasurements() {
      let w = document.getElementById('mWaist');
      let c = document.getElementById('mChest');
      let h = document.getElementById('mHips');
      let b = document.getElementById('mBicep');

      if (w) state.bodyMeasurements.waist = parseFloat(w.value) || state.bodyMeasurements.waist;
      if (c) state.bodyMeasurements.chest = parseFloat(c.value) || state.bodyMeasurements.chest;
      if (h) state.bodyMeasurements.hips = parseFloat(h.value) || state.bodyMeasurements.hips;
      if (b) state.bodyMeasurements.bicep = parseFloat(b.value) || state.bodyMeasurements.bicep;

      saveState();
      alert(state.lang === 'ru' ? "Объемы тела успешно сохранены!" : "Body measurements saved successfully!");
    }

    function openAddFoodDatabaseModal() {
      let overlay = document.createElement('div');

      let modalTitle = state.lang === 'ru' ? "📖 Выберите продукт из базы" : "📖 Select Food from Database";

      `;

      // Первоначальный рендер списка продуктов
      let db = state.customFoodDatabase || defaultFoodDatabase;
      db.forEach(food => {
        html += renderFoodDbItemCard(food);
      });

      html += `
          </div>
          <button class="btn-primary" style="width:100%; background:var(--card-border); color:var(--text-color);" onclick="document.getElementById('foodDbModal').remove()">${closeText}</button>
        </div>
      `;

      overlay.innerHTML = html;
      document.body.appendChild(overlay);
    }

    function renderFoodDbItemCard(food) {
      return `
        <div style="background:var(--card-bg-alt); padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--card-border); display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="selectFoodFromDb(${food.id})">
          <div>
            <div style="font-weight:600; font-size:14px; color:var(--text-color);">${food.name}</div>
            <div style="font-size:11px; color:var(--text-muted);">100г &bull; P:${food.p}г &bull; F:${food.f}г &bull; C:${food.c}г</div>
          </div>
          <div style="font-weight:700; color:var(--accent); font-size:14px;">${food.kcal} ккал</div>
        </div>
      `;
    }

    function filterFoodDatabaseList(query) {
      let container = document.getElementById('foodSearchResultsContainer');
      if (!container) return;

      let q = query.toLowerCase().trim();
      let db = state.customFoodDatabase || defaultFoodDatabase;

      let filtered = db.filter(f => f.name.toLowerCase().includes(q));

      if (filtered.length === 0) {
        let noResText = state.lang === 'ru' ? "Продукты не найдены" : "No foods found";
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:13px;">${noResText}</div>`;
        return;
      }

      container.innerHTML = filtered.map(f => renderFoodDbItemCard(f)).join('');
    }

    function selectFoodFromDb(foodId) {
      let db = state.customFoodDatabase || defaultFoodDatabase;
      let food = db.find(f => f.id === foodId);
      if (!food) return;

      // Стандартная порция 150 грамм с пропорциональным пересчетом
      let defaultWeight = 150;
      let factor = defaultWeight / 100;

      if (!state.meals[state.activeMeal]) {
        state.meals[state.activeMeal] = [];
      }

      state.meals[state.activeMeal].push({
        id: Date.now(),
        name: food.name,
        weight: defaultWeight,
        kcal: Math.round(food.kcal * factor),
        p: Math.round((food.p * factor) * 10) / 10,
        f: Math.round((food.f * factor) * 10) / 10,
        c: Math.round((food.c * factor) * 10) / 10,
        cu: Math.round((food.cu * factor) * 10) / 10
      });

      saveState();

      let modal = document.getElementById('foodDbModal');
      if (modal) modal.remove();

      render();
    }

    function triggerProgressPhotoUpload() {

        if (file) {
          let reader = new FileReader();
          reader.onload = function(event) {
            if (!state.progressPhotos) state.progressPhotos = [];
            state.progressPhotos.unshift({
              date: new Date().toISOString().split('T')[0],
              dataUrl: event.target.result
            });
            saveState();
            render();
            alert(state.lang === 'ru' ? "Фото прогресса успешно сохранено!" : "Progress photo saved successfully!");

          reader.readAsDataURL(file);
        }
      };

      let html = `

    function drawEnterpriseWeightChart() {
      let canvas = document.getElementById('enterpriseWeightChart');
      if (!canvas) return;
      let ctx = canvas.getContext('2d');
      let history = state.weightHistory || [];

      let width = canvas.width;
      let height = canvas.height;
      ctx.clearRect(0, 0, width, height);

      if (history.length === 0) {
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Нет данных для построения графиков', width / 2, height / 2);
        return;
      }

      let weights = history.map(h => h.weight);
      let minW = Math.min(...weights) - 2;
      let maxW = Math.max(...weights) + 2;
      let padding = 40;
      let chartW = width - padding * 2;
      let chartH = height - padding * 2;

      // Отрисовка сетки
      ctx.strokeStyle = '#24304d';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        let y = padding + (chartH / 4) * i;
        ctx.moveTo(padding, y);
        ctx.lineTo(width - padding, y);
      }
      ctx.stroke();

      let points = history.map((item, idx) => {
        let x = history.length === 1 ? width / 2 : padding + (chartW / (history.length - 1)) * idx;
        let y = padding + chartH - ((item.weight - minW) / (maxW - minW || 1)) * chartH;
        return { x, y, weight: item.weight, date: item.date };
      });

      // Линия тренда
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 3;
      ctx.beginPath();
      points.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // Точки
      points.forEach(pt => {
        ctx.fillStyle = '#131b2e';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#f9fafb';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pt.weight + ' kg', pt.x, pt.y - 12);
      });
    }

    async function handleAiPhotoSelection(inputElem) {
      if (!inputElem.files || !inputElem.files[0]) return;

      if (!state.apiKey || state.apiKey === '') {
        alert(state.lang === 'ru' ? "Пожалуйста, введите и сохраните ваш Gemini API Key!" : "Please enter and save your Gemini API Key!");
        return;
      }

      let file = inputElem.files[0];
      let reader = new FileReader();

      reader.onload = function(e) {
        let img = new Image();
        img.onload = function() {
          let canvas = document.createElement('canvas');
          let MAX_W = 800, MAX_H = 800;
          let w = img.width, h = img.height;
          if (w > h) { if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; } }
          else { if (h > MAX_H) { w *= MAX_H / h; h = MAX_H; } }
          canvas.width = w; canvas.height = h;
          let ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let base64Jpg = canvas.toDataURL('image/jpeg', 0.85);
          sendImageToGeminiApi(base64Jpg.split(',')[1]);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function sendImageToGeminiApi(base64Bytes) {
      let loadingBox = document.getElementById('aiModalLoadingBox');
      let resultBox = document.getElementById('aiModalResultBox');
      let confirmBtn = document.getElementById('aiConfirmAddBtn');

      if (loadingBox) loadingBox.classList.remove('hidden');
      if (resultBox) resultBox.classList.add('hidden');
      if (confirmBtn) confirmBtn.classList.add('hidden');

      let promptStr = `Analyze this food image. Return STRICT JSON format only (no markdown, no backticks) with keys:
      - "name": string (descriptive dish name)
      - "weight_g": number (estimated grams)
      - "calories": number (total kcal)
      - "proteins": number (grams)
      - "fats": number (grams)
      - "carbs": number (grams)
      - "carb_units": number (bread units CU)`;

      try {
        let resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${state.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptStr }, { inline_data: { mime_type: "image/jpeg", data: base64Bytes } }] }],
            generationConfig: { temperature: 0.2, maxOutputTokens: 1024 }
          })
        });

        if (!resp.ok) throw new Error(`HTTP error! status: ${resp.status}`);
        let data = await resp.json();

        if (loadingBox) loadingBox.classList.add('hidden');

        if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
          throw new Error("Пустой ответ от Gemini.");
        }

        let rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
        let parsed = JSON.parse(rawText);

        window.tempAiFoodResult = {
          name: parsed.name || "AI Food Dish",
          weight: Number(parsed.weight_g) || 250,
          kcal: Number(parsed.calories) || 350,
          p: Number(parsed.proteins) || 15,
          f: Number(parsed.fats) || 12,
          c: Number(parsed.carbs) || 30,
          cu: Number(parsed.carb_units) || 2.5
        };

        document.getElementById('aiResName').innerText = window.tempAiFoodResult.name;
        document.getElementById('aiResDetails').innerText = `${window.tempAiFoodResult.weight}г • ${window.tempAiFoodResult.kcal} ккал (P:${window.tempAiFoodResult.p} F:${window.tempAiFoodResult.f} C:${window.tempAiFoodResult.c} CU:${window.tempAiFoodResult.cu})`;

        if (resultBox) resultBox.classList.remove('hidden');
        if (confirmBtn) confirmBtn.classList.remove('hidden');

      } catch (err) {
        if (loadingBox) loadingBox.classList.add('hidden');
        alert("Ошибка при обращении к Gemini API: " + err.message);
      }
    }

    function confirmAiParsedFoodItem() {
      if (!window.tempAiFoodResult) return;

      if (!state.meals[state.activeMeal]) {
        state.meals[state.activeMeal] = [];
      }

      state.meals[state.activeMeal].push({
        id: Date.now(),
        ...window.tempAiFoodResult
      });

      saveState();
      window.tempAiFoodResult = null;

      let modal = document.getElementById('aiScannerModal');
      if (modal) modal.remove();

      render();
    }

      applyThemeToDOM();

      // Закрытие модальных окон по клавише Escape

        if (e.key === 'Escape') {
          document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
        }
      });

      // Регистрация Service Worker для PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    });
  </script>
