<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- ========================================================================== -->
  <!--               DIETA PRO - FIXED VIEWPORT ENTERPRISE EDITION                -->
  <!--                         PART 1 OF 6: CSS & LAYOUT                          -->
  <!-- ========================================================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Dieta Pro</title>

  <style>
    /* ========================================================================== */
    /* 1. DESIGN TOKENS & THEME VARIABLES (DARK & LIGHT MODES)                    */
    /* ========================================================================== */
    :root {
      --bg-color: #0b0f19;
      --card-bg: #131b2e;
      --card-bg-alt: #1a243d;
      --card-border: #263354;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.15);
      --purple: #9333ea;
      --purple-soft: rgba(147, 51, 234, 0.15);
      --success: #10b981;
      --success-soft: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --warning-soft: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --orange: #f97316;
      --radius-xs: 8px;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --shadow: 0 8px 24px -6px rgba(0, 0, 0, 0.55);
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    [data-theme="light"] {
      --bg-color: #eef2f6;
      --card-bg: #ffffff;
      --card-bg-alt: #f8fafc;
      --card-border: #cbd5e1;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --purple: #7e22ce;
      --purple-soft: rgba(126, 34, 206, 0.12);
      --success: #059669;
      --success-soft: rgba(5, 150, 105, 0.12);
      --warning: #d97706;
      --warning-soft: rgba(217, 119, 6, 0.12);
      --danger: #dc2626;
      --danger-soft: rgba(220, 38, 38, 0.12);
      --shadow: 0 6px 18px -4px rgba(15, 23, 42, 0.08);
    }

    /* ========================================================================== */
    /* 2. STRICT FIXED VIEWPORT RESET (NO VERTICAL OR HORIZONTAL PAGE SCROLL)     */
    /* ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    input, select, textarea {
      user-select: auto;
      -webkit-user-select: auto;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-size: 12px;
      line-height: 1.35;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* ========================================================================== */
    /* 3. MASTER 3-ROW SHELL ARCHITECTURE (HEADER - CENTER STAGE - 5-TAB FOOTER)  */
    /* ========================================================================== */
    .app-shell {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      height: 100dvh;
      margin: 0 auto;
      padding-top: calc(var(--safe-top) + 6px);
      padding-bottom: calc(var(--safe-bottom) + 62px);
      padding-left: 10px;
      padding-right: 10px;
      overflow: hidden;
    }

    /* Top Header Bar - Compact & Centered */
    .top-bar {
      height: 46px;
      min-height: 46px;
      max-height: 46px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      white-space: nowrap;
    }

    .brand-icon {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.35);
    }

    .brand-text-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.1;
    }

    .brand-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-color);
      white-space: nowrap;
    }

    .brand-sub {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .goal-pill-btn {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 5px 9px;
      border-radius: 14px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: var(--transition);
    }

    .goal-pill-btn:active {
      transform: scale(0.95);
    }

    .top-icon-btn {
      background: var(--card-bg-alt);
      border: 1px solid var(--card-border);
      color: var(--text-color);
      height: 28px;
      padding: 0 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      transition: var(--transition);
    }

    .top-icon-btn:active {
      transform: scale(0.93);
    }

    /* Center Viewport Stage - Strictly Fitted, No Page Scroll */
    .stage-container {
      flex: 1;
      height: calc(100dvh - var(--safe-top) - var(--safe-bottom) - 122px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      overflow: hidden;
    }

    /* ========================================================================== */
    /* 4. CARDS, SUB-TABS & GOAL ANIMATIONS                                       */
    /* ========================================================================== */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-fill {
      flex: 1;
      min-height: 0;
      justify-content: space-between;
    }

    @keyframes goalPulseSuccess {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); border-color: var(--success); }
      50% { box-shadow: 0 0 16px 3px rgba(16, 185, 129, 0.35); border-color: #34d399; }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); border-color: var(--success); }
    }

    @keyframes activityFireGlow {
      0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.55); border-color: var(--orange); }
      50% { box-shadow: 0 0 14px 2px rgba(249, 115, 22, 0.35); border-color: #fb923c; }
      100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); border-color: var(--orange); }
    }

    .achieved-calories {
      animation: goalPulseSuccess 2.2s infinite ease-in-out;
    }

    .achieved-activity {
      animation: activityFireGlow 2.2s infinite ease-in-out;
    }

    /* Confetti Floating Banner inside Card when Goal Reached */
    .goal-banner {
      background: linear-gradient(90deg, rgba(16,185,129,0.2), rgba(59,130,246,0.2));
      border: 1px solid var(--success);
      color: var(--success);
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      text-align: center;
      margin-top: 4px;
    }

    /* ========================================================================== */
    /* 5. DIARY SCREEN: CALORIE RING & 4 MACRO CIRCLES                            */
    /* ========================================================================== */
    .cal-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .cal-main-num {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: var(--text-color);
      line-height: 1.05;
    }

    .cal-main-num span {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .cal-rem-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--success-soft);
      color: var(--success);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      margin-top: 4px;
    }

    .ring-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: conic-gradient(var(--success) var(--pct, 0%), var(--card-border) 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      flex-shrink: 0;
    }

    .ring-circle::before {
      content: attr(data-pct);
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-color);
    }

    .macros-4-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--card-border);
    }

    .macro-item {
      background: var(--card-bg-alt);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 6px 3px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .macro-item.xe-box {
      background: rgba(239, 68, 68, 0.07);
      border-color: rgba(239, 68, 68, 0.35);
    }

    .mini-ring {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: conic-gradient(var(--ring-clr, var(--accent)) var(--pct, 0%), var(--card-border) 0%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 3px;
    }

    .mini-ring::before {
      content: attr(data-pct);
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--card-bg-alt);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      font-weight: 800;
      color: var(--text-color);
    }

    .macro-lbl {
      font-size: 9px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .macro-val {
      font-size: 10px;
      font-weight: 800;
      color: var(--text-color);
      white-space: nowrap;
    }

    /* ========================================================================== */
    /* 6. WATER & ACTIVITY ROW + STRICT 4-COLUMN MEAL TABS                        */
    /* ========================================================================== */
    .water-act-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }

    .wa-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    .wa-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .wa-title {
      font-size: 9px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .wa-value {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
    }

    .wa-btns {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .sq-btn {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      border: 1px solid var(--card-border);
      background: var(--card-bg-alt);
      color: var(--text-color);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sq-btn.plus {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .act-pick-btn {
      background: var(--orange);
      color: #fff;
      border: none;
      padding: 6px 9px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(249, 115, 22, 0.35);
    }

    /* Strictly Fixed 4-Column Meal Switcher (No side-to-side sliding) */
    .meals-4-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      background: var(--card-bg-alt);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .meal-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 2px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: var(--transition);
    }

    .meal-tab-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }

    /* Internal Meal Items Box (Compact list inside fixed card) */
    .meal-items-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding-right: 2px;
    }

    .food-row {
      background: var(--card-bg-alt);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .food-row-left {
      min-width: 0;
    }

    .food-row-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .food-row-sub {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .food-row-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .food-row-kcal {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      white-space: nowrap;
    }

    .food-del-btn {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: none;
      background: var(--danger-soft);
      color: var(--danger);
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .diary-bottom-btns {
      display: grid;
      grid-template-columns: 1.7fr 1.1fr;
      gap: 6px;
      margin-top: 6px;
      flex-shrink: 0;
    }

    .btn-main {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 3px 10px rgba(59, 130, 246, 0.3);
    }

    .btn-ai-scan {
      background: var(--purple);
      color: #ffffff;
      border: none;
      padding: 9px 10px;
      border-radius: var(--radius-sm);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 3px 10px rgba(147, 51, 234, 0.35);
    }

    /* ========================================================================== */
    /* 7. STRICT 5-COLUMN BOTTOM NAVIGATION BAR & MODALS                          */
    /* ========================================================================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(56px + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--card-bg);
      border-top: 1px solid var(--card-border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      align-items: center;
      z-index: 1000;
      max-width: 500px;
      margin: 0 auto;
    }

    .nav-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      height: 48px;
      margin: 0 2px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: var(--transition);
      overflow: hidden;
    }

    .nav-tab.active {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .nav-tab-ico {
      font-size: 16px;
      line-height: 1;
    }

    .nav-tab-lbl {
      font-size: 9px;
      font-weight: 700;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    /* Universal Inner Sub-Nav for Ration, Form & Profile */
    .sub-tabs-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      background: var(--card-bg-alt);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .Form-input, .Form-select {
      width: 100%;
      padding: 8px 10px;
      background: var(--card-bg-alt);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xs);
      color: var(--text-color);
      font-size: 12px;
      font-weight: 600;
      outline: none;
    }

    .Form-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 3px;
      display: block;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.76);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 2500;
    }

    .modal-window {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      padding: 14px;
      width: 100%;
      max-width: 400px;
      max-height: 84dvh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- TOP HEADER BAR -->
    <header class="top-bar" id="topHeaderBar"></header>

    <!-- CENTER FIXED STAGE -->
    <main class="stage-container" id="mainStage"></main>
  </div>

  <!-- STRICT 5-TAB BOTTOM NAVIGATION -->
  <nav class="bottom-nav" id="bottomNavBar">
    <button class="nav-tab active" onclick="switchMainTab('diary')">
      <span class="nav-tab-ico">🍏</span>
      <span class="nav-tab-lbl" id="navLblDiary">Дневник</span>
    </button>
    <button class="nav-tab" onclick="switchMainTab('ration')">
      <span class="nav-tab-ico">🥗</span>
      <span class="nav-tab-lbl" id="navLblRation">Рацион</span>
    </button>
    <button class="nav-tab" onclick="switchMainTab('form')">
      <span class="nav-tab-ico">📏</span>
      <span class="nav-tab-lbl" id="navLblForm">Форма</span>
    </button>
    <button class="nav-tab" onclick="switchMainTab('charts')">
      <span class="nav-tab-ico">📊</span>
      <span class="nav-tab-lbl" id="navLblCharts">Графики</span>
    </button>
    <button class="nav-tab" onclick="switchMainTab('profile')">
      <span class="nav-tab-ico">⚙️</span>
      <span class="nav-tab-lbl" id="navLblProfile">Профиль</span>
    </button>
  </nav>
  <script>
    /* ========================================================================== */
    /*               DIETA PRO - FIXED VIEWPORT ENTERPRISE EDITION                */
    /*           PART 2 OF 6: MULTILINGUAL DICTIONARIES & FOOD DATABASE           */
    /* ========================================================================== */

    /* 1. COMPLETE UI LOCALIZATION DICTIONARY (RU / EN / NL)                      */
    const i18n = {
      ru: {
        appName: "Dieta Pro",
        today: "сегодня",
        goals: {
          loss: "🔥 Похудение",
          gain: "💪 Набор массы",
          norm: "⚖️ Норма"
        },
        goalHint: "Нажмите для смены цели (Похудение / Набор / Норма)",
        nav: {
          diary: "Дневник",
          ration: "Рацион",
          form: "Форма",
          charts: "Графики",
          profile: "Профиль"
        },
        meals: {

    function loadAppState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        const def = createDefaultState();
        const merged = { ...def, ...parsed };
        if (!merged.meals || typeof merged.meals !== "object") {
          merged.meals = def.meals;
        }
        ["breakfast", "lunch", "dinner", "snacks"].forEach(k => {
          if (!Array.isArray(merged.meals[k])) merged.meals[k] = [];
        });
        if (!merged.measures || typeof merged.measures !== "object") {
          merged.measures = def.measures;
        }
        if (!Array.isArray(merged.weightHistory) || merged.weightHistory.length === 0) {
          merged.weightHistory = def.weightHistory;
        }
        if (!Array.isArray(merged.progressPhotos)) {
          merged.progressPhotos = [];
        }
        return merged;
      } catch (e) {
        console.warn("State recovery triggered:", e);
        return createDefaultState();
      }
    }

    /* Bulletproof LocalStorage Saver (Prevents QuotaExceededError after photos) */
    function safeSaveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (quotaErr) {
        console.warn("Storage quota tight, trimming oldest photo to prevent error...");
        if (Array.isArray(state.progressPhotos) && state.progressPhotos.length > 1) {
          state.progressPhotos.pop();
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          } catch (e2) {
            console.error("Fallback storage error:", e2);
          }
        }
      }
    }

    /* Smart Image Compressor for Body Photos & AI Food Scanner (Max ~45KB) */
    function compressImageFile(file, maxW = 560, maxH = 720, quality = 0.68) {
      return new Promise((resolve, reject) => {
        if (!file) return reject(new Error("No file selected"));
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("File read error"));
        reader.onload = (ev) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Image decode error"));
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxW) {
                h = Math.round(h * (maxW / w));
                w = maxW;
              }
            } else {
              if (h > maxH) {
                w = Math.round(w * (maxH / h));
                h = maxH;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(dataUrl);
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /* Helper: Translate any dish or item name dynamically into active language */
    function getLocalizedName(itemObj) {
      if (!itemObj) return "";
      if (itemObj.foodId) {
        const dbMatch = FOOD_DB.find(f => f.id === itemObj.foodId);
        if (dbMatch && dbMatch.name && dbMatch.name[state.lang]) {
          return dbMatch.name[state.lang];
        }
      }
      if (itemObj.name && typeof itemObj.name === "object") {
        return itemObj.name[state.lang] || itemObj.name.ru || itemObj.name.en || "";
      }
      return String(itemObj.name || "");
    }

    /* Recalculate Daily Calories & Macros via Mifflin-St Jeor + Active Goal */
    function recalculateMetabolicTargets(silent = true) {
      const w = Number(state.weight) || 80;
      const h = Number(state.height) || 175;
      const a = Number(state.age) || 35;
      const mult = Number(state.activityMultiplier) || 1.375;

      let bmr = (10 * w) + (6.25 * h) - (5 * a);
      bmr += (state.gender === "male" ? 5 : -161);

      let tdee = bmr * mult;
      if (state.goalMode === "loss") tdee *= 0.85;
      else if (state.goalMode === "gain") tdee *= 1.15;

      state.caloriesGoal = Math.max(1200, Math.round(tdee));
      state.proteinGoal = Math.round((state.caloriesGoal * 0.26) / 4);
      state.fatGoal = Math.round((state.caloriesGoal * 0.29) / 9);
      state.carbGoal = Math.round((state.caloriesGoal * 0.45) / 4);

      safeSaveState();
      if (!silent) {
        const t = i18n[state.lang] || i18n.ru;
        alert(`${t.savedAlert} (${state.caloriesGoal} ${t.kcalUnit})`);
      }
    }

      else state.goalMode = "loss";

      recalculateMetabolicTargets(true);
      renderApp();
    }

    function drawAnalyticsCanvas(mode) {
      const canvas = document.getElementById("enterpriseAnalyticsCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      const history = state.weightHistory || [];
      if (history.length === 0) {
        ctx.fillStyle = "#94a3b8";
        ctx.font = "11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Недостаточно данных для графика", w / 2, h / 2);
        return;
      }

      const weights = history.map(h => h.weight);
      const minW = Math.min(...weights) - 1;
      const maxW = Math.max(...weights) + 1;
      const pad = 30;
      const cW = w - pad * 2;
      const cH = h - pad * 2;

      // Draw background grid lines
      ctx.strokeStyle = state.theme === "dark" ? "#263354" : "#cbd5e1";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 3; i++) {
        let yPos = pad + (cH / 3) * i;
        ctx.moveTo(pad, yPos);
        ctx.lineTo(w - pad, yPos);
      }
      ctx.stroke();

      // Compute points coordinates
      const points = history.map((item, idx) => {
        const x = history.length === 1 ? w / 2 : pad + (cW / (history.length - 1)) * idx;
        const y = pad + cH - ((item.weight - minW) / (maxW - minW || 1)) * cH;
        return { x, y, weight: item.weight, date: item.date };
      });

      // Draw smooth gradient fill under curve
      const grad = ctx.createLinearGradient(0, pad, 0, pad + cH);
      grad.addColorStop(0, "rgba(59, 130, 246, 0.35)");
      grad.addColorStop(1, "rgba(59, 130, 246, 0.0)");

      ctx.fillStyle = grad;
      ctx.beginPath();
      points.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      if (points.length > 0) {
        ctx.lineTo(points[points.length - 1].x, pad + cH);
        ctx.lineTo(points[0].x, pad + cH);
        ctx.closePath();
        ctx.fill();
      }

      // Draw trend line
      ctx.strokeStyle = "#3b82f6";
      ctx.lineWidth = 3;
      ctx.beginPath();
      points.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // Draw point circles & labels
      points.forEach(pt => {
        ctx.fillStyle = state.theme === "dark" ? "#131b2e" : "#ffffff";
        ctx.strokeStyle = "#3b82f6";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = state.theme === "dark" ? "#f8fafc" : "#0f172a";
        ctx.font = "bold 10px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(pt.weight + "kg", pt.x, pt.y - 10);
      });
    }

    function renderFoodDbOptionsHtml(query) {

    function confirmAddFoodToMeal() {
      const pInput = document.getElementById("modalPortionGrams");
      const grams = pInput ? Math.max(10, parseFloat(pInput.value) || 150) : 150;
      const factor = grams / 100;

      let newItem = null;

      if (tempCustomFoodMode) {
        const nameInp = document.getElementById("customFoodName");
        const kInp = document.getElementById("customFoodKcal");
        const pInp = document.getElementById("customFoodP");
        const fInp = document.getElementById("customFoodF");
        const cInp = document.getElementById("customFoodC");

        const cName = nameInp ? nameInp.value.trim() : "Блюдо";
        const baseK = kInp ? parseFloat(kInp.value) || 200 : 200;
        const baseP = pInp ? parseFloat(pInp.value) || 10 : 10;
        const baseF = fInp ? parseFloat(fInp.value) || 10 : 10;
        const baseC = cInp ? parseFloat(cInp.value) || 20 : 20;

        newItem = {
          id: Date.now(),
          name: { ru: cName, en: cName, nl: cName },
          grams: grams,
          kcal: Math.round(baseK * factor),
          p: Math.round((baseP * factor) * 10) / 10,
          f: Math.round((baseF * factor) * 10) / 10,
          c: Math.round((baseC * factor) * 10) / 10,
          cu: Math.round(((baseC * factor) / 12) * 10) / 10
        };
      } else {
        const foodDef = FOOD_DB.find(f => f.id === window.selectedModalFoodId) || FOOD_DB[0];
        newItem = {
          id: Date.now(),
          foodId: foodDef.id,
          name: foodDef.name,
          grams: grams,
          kcal: Math.round(foodDef.kcal * factor),
          p: Math.round((foodDef.p * factor) * 10) / 10,
          f: Math.round((foodDef.f * factor) * 10) / 10,
          c: Math.round((foodDef.c * factor) * 10) / 10,
          cu: Math.round((foodDef.cu * factor) * 10) / 10
        };
      }

      if (!state.meals[state.activeMeal]) state.meals[state.activeMeal] = [];
      state.meals[state.activeMeal].push(newItem);

      safeSaveState();
      const modal = document.getElementById("enterpriseFoodModal");
      if (modal) modal.remove();
      renderApp();
    }

    async function executeGeminiAiScan(fileInputElem) {
      if (!fileInputElem.files || !fileInputElem.files[0]) return;
      const keyInput = document.getElementById("modalAiKey");
      const currentKey = keyInput ? keyInput.value.trim() : state.apiKey;

      if (!currentKey) {
        alert("Пожалуйста, введите ваш Google Gemini API Key!");
        return;
      }

      state.apiKey = currentKey;
      safeSaveState();

      const loadBox = document.getElementById("aiLoadingIndicator");
      const resBox = document.getElementById("aiResultContainer");
      const confirmBtn = document.getElementById("aiConfirmAddBtn");

      if (loadBox) loadBox.classList.remove("hidden");
      if (resBox) resBox.classList.add("hidden");
      if (confirmBtn) confirmBtn.classList.add("hidden");

      try {
        const compressedBase64 = await compressImageFile(fileInputElem.files[0], 640, 640, 0.75);
        const base64Bytes = compressedBase64.split(",")[1];

        const promptText = `Analyze this food image. Return STRICT JSON format only (no markdown, no backticks) with keys:
        - "name": string (descriptive dish name in ${state.lang})
        - "weight_g": number (estimated grams)
        - "calories": number (total kcal)
        - "proteins": number (grams)
        - "fats": number (grams)
        - "carbs": number (grams)
        - "carb_units": number (bread units CU)`;
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`;
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: promptText },
                { inline_data: { mime_type: "image/jpeg", data: base64Bytes } }
              ]
            }],
            generationConfig: { temperature: 0.2, maxOutputTokens: 512 }
          })
        });

        if (!response.ok) throw new Error(`HTTP error: ${response.status}`);
        const data = await response.json();

        if (loadBox) loadBox.classList.add("hidden");

        if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
          throw new Error("Пустой ответ от Gemini API");
        }

        const rawText = data.candidates[0].content.parts[0].text
          .replace(/```json/g, "")
          .replace(/```/g, "")
          .trim();

        const parsed = JSON.parse(rawText);

        tempAiParsedResult = {
          baseName: parsed.name || "AI Food Dish",
          baseGrams: Number(parsed.weight_g) || 250,
          baseKcal: Number(parsed.calories) || 350,
          baseP: Number(parsed.proteins) || 15,
          baseF: Number(parsed.fats) || 12,
          baseC: Number(parsed.carbs) || 30,
          baseCU: Number(parsed.carb_units) || 2.5
        };

        const gInp = document.getElementById("aiResGramsInput");
        if (gInp) gInp.value = tempAiParsedResult.baseGrams;

        updateAiResultDisplay(tempAiParsedResult, tempAiParsedResult.baseGrams);

        if (resBox) resBox.classList.remove("hidden");
        if (confirmBtn) confirmBtn.classList.remove("hidden");

      } catch (err) {
        if (loadBox) loadBox.classList.add("hidden");
        console.error("Gemini AI error:", err);
        alert("Ошибка при обращении к Gemini API: " + err.message);
      }
    }

    function recalcAiParsedItemGrams(newGramsVal) {
      if (!tempAiParsedResult) return;
      const g = Math.max(10, parseFloat(newGramsVal) || 250);
      updateAiResultDisplay(tempAiParsedResult, g);
    }

    function updateAiResultDisplay(baseObj, currentGrams) {
      const factor = currentGrams / baseObj.baseGrams;
      const curKcal = Math.round(baseObj.baseKcal * factor);
      const curP = Math.round((baseObj.baseP * factor) * 10) / 10;
      const curF = Math.round((baseObj.baseF * factor) * 10) / 10;
      const curC = Math.round((baseObj.baseC * factor) * 10) / 10;
      const curCU = Math.round((baseObj.baseCU * factor) * 10) / 10;

      window.activeAiCalculatedItem = {
        name: { ru: baseObj.baseName, en: baseObj.baseName, nl: baseObj.baseName },
        grams: currentGrams,
        kcal: curKcal,
        p: curP,
        f: curF,
        c: curC,
        cu: curCU
      };

      const nameEl = document.getElementById("aiResDishName");
      const nutEl = document.getElementById("aiResNutrients");
      if (nameEl) nameEl.innerText = baseObj.baseName;
      if (nutEl) {
        const t = i18n[state.lang] || i18n.ru;
        nutEl.innerHTML = `${currentGrams}${t.gramUnit} &bull; ${curKcal} ${t.kcalUnit} &bull; Б:${curP} Ж:${curF} У:${curC} &bull; ${curCU} ${t.cuUnit}`;
      }
    }

    function confirmAddAiFoodItem() {
      if (!window.activeAiCalculatedItem) return;
      if (!state.meals[state.activeMeal]) state.meals[state.activeMeal] = [];

      state.meals[state.activeMeal].push({
        id: Date.now(),
        ...window.activeAiCalculatedItem
      });

      safeSaveState();
      window.activeAiCalculatedItem = null;
      tempAiParsedResult = null;

      const modal = document.getElementById("enterpriseAiModal");
      if (modal) modal.remove();
      renderApp();
    }

      }
