<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Калории Pro">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#090d16">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2310b981'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>🔥</text></svg>">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2310b981'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>🔥</text></svg>">
    <title>Калории Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-grad: #111827;
            --card-bg: rgba(30, 41, 59, 0.78);
            --card-sub: rgba(15, 23, 42, 0.65);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-sub: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.7);
            --ring-track: #1e293b;
        }

        body.light-theme {
            --bg-main: #f1f5f9;
            --bg-grad: #e2e8f0;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-sub: rgba(241, 245, 249, 0.8);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-sub: rgba(0, 0, 0, 0.08);
            --input-bg: rgba(241, 245, 249, 0.9);
            --ring-track: #cbd5e1;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        html {
            height: -webkit-fill-available;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-sub);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease, border 0.3s ease;
        }

        .glass-sub {
            background: var(--card-sub);
            border: 1px solid var(--border-sub);
            transition: background 0.3s ease, border 0.3s ease;
        }

        .custom-input {
            background-color: var(--input-bg);
            border: 1px solid var(--border-sub);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .custom-input:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
            outline: none;
        }

        /* Плавные переходы для табов */
        .tab-content {
            display: none;
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.3);
            border-radius: 4px;
        }

        .no-tap-highlight {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-100 antialiased selection:bg-emerald-500 selection:text-white pb-24">

    <!-- ВЕРХНЯЯ ШАПКА -->
    <header class="sticky top-0 z-40 glass-card border-x-0 border-t-0 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 text-white font-bold text-xl">
                🔥
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h1 class="font-bold text-lg leading-tight tracking-tight">Калории Pro</h1>
                    <span id="streakBadge" class="hidden text-[10px] bg-amber-500/20 text-amber-400 font-semibold px-1.5 py-0.5 rounded-full border border-amber-500/30 items-center space-x-0.5">
                        🔥 <span id="streakCount">0</span> дн.
                    </span>
                </div>
                <p id="currentDateLabel" class="text-xs text-slate-400 font-medium">Загрузка...</p>
            </div>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Кнопка смены темы -->
            <button onclick="toggleTheme()" aria-label="Сменить тему" class="w-9 h-9 rounded-xl glass-sub flex items-center justify-center text-slate-300 hover:text-white transition active:scale-95">
                <span id="themeIcon">☀️</span>
            </button>
            <!-- Быстрый выбор даты -->
            <input type="date" id="headerDateInput" onchange="onHeaderDateChange(this.value)" class="custom-input text-xs rounded-xl px-2.5 py-2 font-medium cursor-pointer">
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕЙНЕР -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 space-y-5">

        <!-- ВКЛАДКА 1: ДНЕВНИК -->
        <div id="tab-diary" class="tab-content active space-y-5">
            
            <!-- ГЛАВНЫЙ КОЛЬЦЕВОЙ ПРОГРЕСС -->
            <div class="glass-card rounded-3xl p-5 relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-40 h-40 bg-emerald-500/10 rounded-full blur-2xl pointer-events-none"></div>
                <div class="absolute -left-10 -bottom-10 w-40 h-40 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>

                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-sm font-semibold tracking-wide uppercase text-slate-400">Баланс дня</h2>
                    <button onclick="openSettingsModal()" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium flex items-center space-x-1 glass-sub px-2.5 py-1 rounded-lg">
                        <span>🎯 Цель: <span id="goalDisplay">2000</span> ккал</span>
                    </button>
                </div>

                <!-- Основной виджет прогресса -->
                <div class="flex items-center justify-between my-2">
                    <!-- Левая колонка: Сгорело / Остаток -->
                    <div class="space-y-3 flex-1 pr-2">
                        <div class="glass-sub rounded-2xl p-3 flex items-center justify-between">
                            <div>
                                <div class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Потреблено</div>
                                <div id="consumedDisplay" class="text-xl font-bold tracking-tight text-emerald-400">0</div>
                            </div>
                            <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold">🍽️</div>
                        </div>

                        <div class="glass-sub rounded-2xl p-3 flex items-center justify-between">
                            <div>
                                <div class="text-[11px] font-medium text-slate-400 uppercase tracking-wider">Остаток</div>
                                <div id="remainingDisplay" class="text-xl font-bold tracking-tight text-blue-400">2000</div>
                            </div>
                            <div class="w-8 h-8 rounded-xl bg-blue-500/20 text-blue-400 flex items-center justify-center font-bold">🎯</div>
                        </div>
                    </div>

                    <!-- Правая колонка: Круговой прогресс бар -->
                    <div class="relative flex items-center justify-center p-2">
                        <svg class="w-36 h-36 transform -rotate-90">
                            <circle cx="72" cy="72" r="60" stroke="currentColor" stroke-width="10" class="text-slate-800/60" fill="transparent"></circle>
                            <circle id="progressRingCircle" cx="72" cy="72" r="60" stroke="url(#emeraldGradient)" stroke-width="10" stroke-linecap="round" stroke-dasharray="376.99" stroke-dashoffset="376.99" fill="transparent" class="transition-all duration-500 ease-out"></circle>
                            <defs>
                                <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#10b981" />
                                    <stop offset="100%" stop-color="#06b6d4" />
                                </linearGradient>
                            </defs>
                        </svg>
                        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                            <span id="percentDisplay" class="text-2xl font-black tracking-tighter">0%</span>
                            <span class="text-[10px] text-slate-400 uppercase font-medium">от нормы</span>
                        </div>
                    </div>
                </div>

                <!-- Блок БЖУ -->
                <div class="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-slate-700/40">
                    <div class="glass-sub rounded-xl p-2.5 text-center">
                        <div class="text-[10px] font-semibold text-rose-400 uppercase mb-0.5">Белки</div>
                        <div class="text-sm font-bold"><span id="proteinDisplay">0</span><span class="text-[10px] text-slate-400 font-normal">/</span><span id="proteinGoalDisplay" class="text-[11px] text-slate-400 font-normal">110г</span></div>
                        <div class="w-full bg-slate-800 h-1 rounded-full mt-1.5 overflow-hidden">
                            <div id="proteinBar" class="bg-rose-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="glass-sub rounded-xl p-2.5 text-center">
                        <div class="text-[10px] font-semibold text-amber-400 uppercase mb-0.5">Жиры</div>
                        <div class="text-sm font-bold"><span id="fatDisplay">0</span><span class="text-[10px] text-slate-400 font-normal">/</span><span id="fatGoalDisplay" class="text-[11px] text-slate-400 font-normal">65г</span></div>
                        <div class="w-full bg-slate-800 h-1 rounded-full mt-1.5 overflow-hidden">
                            <div id="fatBar" class="bg-amber-500 h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="glass-sub rounded-xl p-2.5 text-center">
                        <div class="text-[10px] font-semibold text-sky-400 uppercase mb-0.5">Углеводы</div>
                        <div class="text-sm font-bold"><span id
