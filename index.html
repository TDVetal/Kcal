<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:var(--bg);color:var(--tx);font-size:14px}
#app{position:absolute;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
header{flex:none;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;gap:6px}
.ra{display:flex;gap:5px}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 12px 10px;display:flex;flex-direction:column;gap:10px}
main>*{min-width:0;flex:none}
main.fill>.grow{flex:1;min-height:0}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--cd);border-top:1px solid var(--bd);padding:2px 0 max(0px,calc(var(--np) + env(safe-area-inset-bottom,0px)*.4))}
nav button{background:none;border:0;color:var(--mu);padding:8px 0 2px;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.mu{color:var(--mu);font-size:11px}
.pill,.ib{background:var(--ca);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:7px 10px;font-size:12px;font-weight:700}.pill{color:var(--ok)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:800;width:100%}
.btn.pu{background:var(--pu)}.btn.gh{background:var(--ca);color:var(--tx);border:1px solid var(--bd)}
input,select{width:100%;padding:10px;background:var(--ca);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font-size:16px;outline:0}
label{display:block;font-size:11px;font-weight:700;color:var(--mu);margin:6px 0 3px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--ca);padding:4px;border-radius:12px}
.tabs button{background:none;border:0;color:var(--mu);padding:9px 2px;border-radius:9px;font-size:12px;font-weight:700}
.tabs button.on{background:var(--ac);color:#fff}
.fr{background:var(--ca);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fr .n{font-weight:700;font-size:14px}
.x{background:rgba(239,68,68,.15);color:var(--dg);border:0;border-radius:9px;width:34px;height:34px;font-weight:800;font-size:15px}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.mw{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:88dvh;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.ts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);background:var(--ok);color:#fff;padding:9px 16px;border-radius:20px;font-weight:700;z-index:99}
.rg{position:relative;display:grid;place-items:center;flex:none}
.rg svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-linecap:round}
.rg .t{stroke:var(--bd)}
.rg .a,.rg .o{transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1),stroke .4s,opacity .3s}
.rg .o{transition-delay:.35s,0s,0s}
.rg .c{position:relative;text-align:center;line-height:1.15}
.rg.pl{animation:pl .9s ease 1}
@keyframes pl{40%{transform:scale(1.07);filter:drop-shadow(0 0 10px var(--ok))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>

const cu=(n,to)=>`<b class="cu" data-n="${n}" data-to="${to}">${PN[n]||0}</b>`;
function animRings(){const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;

document.querySelectorAll(".rg").forEach(g=>{const f=+g.dataset.f,k=g.dataset.k,a=g.querySelector(".a"),o=g.querySelector(".o"),pv=PV[k];
a.style.stroke=k=="cal"&&f>1?"var(--dg)":g.dataset.c;a.style.strokeDashoffset=CR*(1-Math.min(1,f));a.style.opacity=f>0?1:0;

lang:()=>{A.lang=A.lang=="ru"?"en":A.lang=="en"?"nl":"ru";save();render()},

$("#nv").innerHTML=[["diary","🍏"],["ration","🥗"],["form","⚖️"],["charts","📊"],["prof","⚙️"]].map(([k,i])=>`<button class="${A.tab==k?"on":""}" data-a="go" data-v="${k}"><i>${i}</i>${t(k)}</button>`).join("");

<div class="row" style="margin-top:10px"><b>≈ ${tk} ${t("kcal")}</b><span class="mu">${t("goal")} ${A.kcalG}</span></div><button class="btn" style="margin-top:10px" data-a="loadRt">${t("rload")}</button></div>`};
Object.assign(ACT,{
ft:v=>{A.ftab=v;save();render()},rt:v=>{A.rt=v;save();render()},
saveW:()=>{const sw=num("sw",0),w=num("w",0),h=num("h",0),tw=num("tw",0);if(sw>30&&sw<350)A.startW=sw;if(w>30&&w<350)A.weight=w;if(h>100&&h<250)A.height=Math.round(h);if(tw>30&&tw<350)A.target=tw;
const e=A.hist.find(x=>x.d===today());if(e)e.w=A.weight;else A.hist.push({d:today(),w:A.weight});A.hist.sort((a,b)=>a.d.localeCompare(b.d));if(!A.manual)calc();save();render();toast(t("saved"))},
saveM:()=>{MK.forEach(k=>{const v=num("m_"+k,0);if(v>0)A.meas[k]=v});save();toast(t("saved"))},
addPhoto:async(v,el)=>{const f=el.files[0];el.value="";if(!f)return;try{const u=await shrink(f,640);A.photos.unshift({id:Date.now(),d:today(),w:A.weight,u});PHD=true;save();render();toast(t("saved"))}catch(e){alert(e.message)}},
delPhoto:v=>{A.photos=A.photos.filter(p=>p.id!=v);PHD=true;save();render()},
loadRt:()=>{const d=DW();plan().forEach((L,x)=>L.forEach(it=>{if(!d.meals[M[x]].some(e=>nm(e)==nm(it)))d.meals[M[x]].push(it)}));A.tab="diary";save();render();toast(t("rloaded"))}});
</script>
<style>.dl{animation:dl 1.2s ease}@keyframes dl{from{stroke-dashoffset:1000}}.gb{transform-box:fill-box;transform-origin:bottom;animation:gb .8s cubic-bezier(.22,1,.36,1)}@keyframes gb{from{transform:scaleY(0)}}</style>
<script>
Object.assign(T,{avg:["Средний калораж","Avg calories","Gem. calorieën"],chg:["Изменение веса","Weight change","Gewichtsverandering"],wavg:["Вода, среднее","Water, avg","Water, gem."],
days:["Дни","Days","Dagen"],weeks:["Недели","Weeks","Weken"],months:["Месяцы","Months","Maanden"],wchart:["Вес, кг","Weight, kg","Gewicht, kg"],kchart:["Калории по дням","Daily calories","Calorieën per dag"]});
const lab=k=>k.length==7?k.slice(5)+"."+k.slice(2,4):k.slice(8)+"."+k.slice(5,7);
const mon=x=>{const d=new Date(x+"T00:00:00");d.setDate(d.getDate()-(d.getDay()+6)%7);return iso(d)};
const dk=d=>{try{return Math.round(tot(d).k)}catch(e){return d.lk||0}};
function grp(en,kf){const g={};en.forEach(([d,v])=>{const k=kf(d);(g[k]=g[k]||[]).push(v)});return Object.keys(g).sort().slice(-8).map(k=>({l:lab(k),v:Math.round(g[k].reduce((a,b)=>a+b,0)/g[k].length*10)/10}))}
const kf=()=>A.period=="weeks"?mon:d=>d.slice(0,7);
function wSeries(){const h=A.hist.map(x=>[x.d,x.w]);return A.period=="days"?h.slice(-10).map(([d,v])=>({l:lab(d),v})):grp(h,kf())}
function kSeries(){if(A.period=="days")return[6,5,4,3,2,1,0].map(i=>{const d=addDays(today(),-i);return{l:lab(d),v:A.days[d]?dk(A.days[d]):0}});
return grp(Object.entries(A.days).map(([d,o])=>[d,dk(o)]).filter(x=>x[1]>0),kf())}
function lineSvg(D){const W=320,H=150,pl=16,pt=22,pb=24,n=D.length;if(!n)return"";const vs=D.map(o=>o.v),mn=Math.min(...vs)-1,mx=Math.max(...vs)+1,
P=D.map((o,i)=>[n==1?W/2:pl+(W-2*pl)*i/(n-1),pt+(H-pt-pb)*(1-(o.v-mn)/(mx-mn))]);
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}" stroke="var(--bd)"/>
${n>1?`<path class="dl" pathLength="1000" stroke-dasharray="1000" d="${P.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("")}" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`:""}
${P.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#3b82f6"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="10" font-weight="700" style="fill:var(--tx)">${D[i].v}</text>${n<=6||i==0||i==n-1?`<text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="10" style="fill:var(--mu)">${D[i].l}</text>`:""}`).join("")}</svg>`}
function barSvg(D,goal){const W=320,H=150,pl=10,pt=18,pb=24,n=D.length;if(!n)return"";const mx=Math.max(goal,...D.map(o=>o.v))*1.12||1,bw=Math.min(28,(W-2*pl)/n*.6),y=v=>pt+(H-pt-pb)*(1-v/mx);
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block"><line x1="${pl}" x2="${W-pl}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--wa)" stroke-dasharray="4 4"/><line x1="${pl}" x2="${W-pl}" y1="${H-pb}" y2="${H-pb}" stroke="var(--bd)"/>
${D.map((o,i)=>{const x=pl+(W-2*pl)*(i+.5)/n;return`<rect class="gb" x="${x-bw/2}" y="${y(o.v)}" width="${bw}" height="${Math.max(0,H-pb-y(o.v))}" rx="4" fill="${o.v>goal*1.08?"#ef4444":"#3b82f6"}"/>${o.v?`<text x="${x}" y="${y(o.v)-4}" text-anchor="middle" font-size="9" font-weight="700" style="fill:var(--tx)">${o.v}</text>`:""}<text x="${x}" y="${H-8}" text-anchor="middle" font-size="9" style="fill:var(--mu)">${o.l}</text>`}).join("")}</svg>`}
V.charts=()=>{const all=Object.values(A.days).map(dk).filter(v=>v>0),avg=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length):0,ch=r1(A.weight-A.startW),b=bmiOf(),
wl=[...Array(14).keys()].map(i=>A.days[addDays(today(),-i)]).filter(d=>d&&d.water>0).map(d=>d.water/Math.max(1,A.waterG)),
wp=wl.length?Math.round(wl.reduce((a,b)=>a+b,0)/wl.length*100)+"%":"—",sc=(n,v,c)=>`<div class="card" style="text-align:center"><div class="mu">${t(n)}</div><b style="font-size:18px;color:${c}">${v}</b></div>`;
return`<div class="card"><div class="tabs">${["days","weeks","months"].map(p=>`<button class="${A.period==p?"on":""}" data-a="period" data-v="${p}">${t(p)}</button>`).join("")}</div><div class="mu" style="margin:10px 0 4px">${t("wchart")}</div>${lineSvg(wSeries())}</div>
<div class="card"><div class="mu" style="margin-bottom:4px">${t("kchart")} · ${t("goal")} ${A.kcalG}</div>${barSvg(kSeries(),A.kcalG)}</div>
<div class="grid g2">${sc("avg",avg?avg+" "+t("kcal"):"—","var(--ac)")}${sc("chg",(ch>0?"+":"")+ch+" "+t("kg"),(A.goal=="gain"?ch>=0:ch<=0)?"var(--ok)":"var(--dg)")}${sc("wavg",wp,"var(--ac)")}${sc("bmi",r1(b),bmiC(b))}</div>`};
ACT.period=v=>{A.period=v;save();render()};
</script>
<script>render()</script>
