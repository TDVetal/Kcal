<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Калории Pro</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#3b82f6',
            surface: { dark: '#111827', light: '#f3f4f6' },
            card: { dark: '#1f2937', light: '#ffffff' }
          }
        }
      }
    }
  </script>
  <style>
    body {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-top { padding-top: env(safe-area-inset-top); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 flex flex-col h-screen overflow-hidden font-sans safe-top safe-bottom">

  <!-- ШАПКА ПРИЛОЖЕНИЯ -->
  <header class="px-4 py-3 flex items-center justify-between border-b border-gray-800 shrink-0">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-lg shadow-lg">🔥</div>
      <div>
        <h1 class="text-base font-black leading-tight">Калории Pro</h1>
        <p id="todayDate" class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Сегодня</p>
      </div>
    </div>
    
    <!-- Кнопки управления в шапке -->
    <div class="flex items-center space-x-1.5">
      <!-- Цель -->
      <button onclick="cycleGoal()" id="goalBtn" class="px-2.5 py-1 rounded-xl bg-gray-800/80 border border-gray-700/60 text-xs font-bold text-emerald-400 active:scale-95 transition">
        🔥 Похудение
      </button>

      <!-- Авто / Ручная смена темы -->
      <button onclick="toggleThemeManual()" id="themeBtn" class="p-1.5 rounded-xl bg-gray-800/80 border border-gray-700/60 text-xs active:scale-95 transition">
        🌓
      </button>

      <!-- Компактный переключатель языка -->
      <button onclick="nextLanguage()" id="langBtn" class="px-2 py-1 rounded-xl bg-gray-800/80 border border-gray-700/60 text-xs font-black active:scale-95 transition text-blue-400">
        🌐 RU
      </button>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ (Строго под высоту экрана, без прокрутки) -->
  <main class="flex-1 flex flex-col p-4 overflow-hidden space-y-3">
    
    <!-- 1. Сводка дня (КБЖУ круг/полоски) -->
    <div class="bg-gray-900/90 border border-gray-800/80 rounded-2xl p-3 shrink-0">
      <div class="flex justify-between items-center mb-2">
        <div>
          <span class="text-2xl font-black text-white" id="currentKcal">0</span>
          <span class="text-xs text-gray-400" id="targetKcalLabel">/ 2000 ккал</span>
        </div>
        <div class="text-right">
          <span class="text-xs font-bold text-emerald-400" id="remainingKcal">Осталось 2000</span>
        </div>
      </div>
      <!-- Полоски БЖУ -->
      <div class="grid grid-cols-3 gap-2 text-center text-[11px] font-bold">
        <div class="bg-gray-800/70 p-1.5 rounded-xl border border-blue-500/30">
          <span class="text-blue-400 block" id="bLabel">Белки</span>
          <span id="statB">0g</span>
        </div>
        <div class="bg-gray-800/70 p-1.5 rounded-xl border border-amber-500/30">
          <span class="text-amber-400 block" id="zLabel">Жиры</span>
          <span id="statZ">0g</span>
        </div>
        <div class="bg-gray-800/70 p-1.5 rounded-xl border border-emerald-500/30">
          <span class="text-emerald-400 block" id="uLabel">Углеводы</span>
          <span id="statU">0g</span>
        </div>
      </div>
    </div>

    <!-- 2. Компактные подменю приемов пищи: ВКЛАДКИ -->
    <div class="flex-1 flex flex-col bg-gray-900/80 border border-gray-800 rounded-2xl overflow-hidden p-3">
      <!-- Переключатели подменю (Табы) -->
      <div class="grid grid-cols-4 gap-1 p-1 bg-gray-800/70 rounded-xl shrink-0 text-xs font-bold mb-3" id="mealTabsBar">
        <button onclick="switchMealTab('breakfast')" id="tabBtn-breakfast" class="py-1.5 rounded-lg bg-blue-600 text-white transition">Завтрак</button>
        <button onclick="switchMealTab('lunch')" id="tabBtn-lunch" class="py-1.5 rounded-lg text-gray-400 hover:text-white transition">Обед</button>
        <button onclick="switchMealTab('dinner')" id="tabBtn-dinner" class="py-1.5 rounded-lg text-gray-400 hover:text-white transition">Ужин</button>
        <button onclick="switchMealTab('snack')" id="tabBtn-snack" class="py-1.5 rounded-lg text-gray-400 hover:text-white transition">Перекус</button>
      </div>

      <!-- Содержимое выбранного приема пищи -->
      <div class="flex-1 flex flex-col justify-between overflow-y-auto">
        <div id="activeMealList" class="space-y-1.5 text-xs">
          <!-- Сюда динамически выводятся блюда текущего приема -->
          <p class="text-center text-gray-500 py-6" id="emptyMealText">Пока пусто — нажмите «+ Еда»</p>
        </div>

        <!-- Кнопка добавления в активный прием -->
        <button onclick="openAddFoodModal()" class="w-full mt-2 py-2.5 bg-blue-600 active:bg-blue-700 text-white font-black rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg shrink-0">
          <span>+</span> <span id="addFoodBtnText">Добавить еду</span>
        </button>
      </div>
    </div>
  </main>
