      --card-bg-alt: #f8fafc;

      --text-color: #0f172a;
      --text-muted: #64748b;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);

    /* ========================================================================== */
    /* 2. GLOBAL RESET & BASE ENTERPRISE STYLING                                  */
    /* ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      height: 100%;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 110px;
      padding-top: env(safe-area-inset-top);
      transition: var(--transition);
      overflow-x: hidden;
      min-height: 100%;
      line-height: 1.5;

    ::-webkit-scrollbar { width: 6px; height: 6px; }

    ::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }

    .hidden { display: none !important; }
    .container { max-width: 620px; margin: 0 auto; padding: 16px; }

      animation: pulseGlow 2s infinite;

    .btn-primary { background: var(--accent); color: white; border: none; padding: 14px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); transition: var(--transition); }

    .nav-item.active { color: var(--accent); background: rgba(59, 130, 246, 0.12); }

    .weight-box .wb-label { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
    .weight-box .wb-val { font-size: 16px; font-weight: 900; margin-top: 4px; color: var(--text-color); }
    
    input, select { width: 100%; padding: 14px; background: var(--card-bg-alt); border: 1px solid var(--card-border); color: var(--text-color); border-radius: var(--radius-sm); margin-bottom: 12px; font-size: 15px; outline: none; transition: var(--transition); }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
    label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 600; }

    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-md); padding: 24px; width: 100%; max-width: 480px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }

        if (!savedData) return null;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

        console.error("Critical error saving state to localStorage:", err);
        alert("Ошибка сохранения данных в память браузера!");
      }
    }

    /* ========================================================================== */
    /* 12. NAVIGATION, THEME & LANGUAGE CONTROLLER SUBSYSTEM                     */
    /* ========================================================================== */
    function switchTab(tabName) {
      const validTabs = ['diary', 'ration', 'form', 'charts', 'profile'];
      if (!validTabs.includes(tabName)) return;

      state.activeTab = tabName;
      saveState();

      document.querySelectorAll('.nav-item').forEach((el, idx) => {
        if (validTabs[idx] === tabName) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyThemeToDOM();
      saveState();
      render();
    }

    function applyThemeToDOM() {
      if (state.theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
    }

    function toggleLang() {
      if (state.lang === 'ru') state.lang = 'en';
      else if (state.lang === 'en') state.lang = 'nl';
      else state.lang = 'ru';
      
      saveState();
      render();
    }

    /* ========================================================================== */
    /* 13. METABOLIC CALCULATOR (MIFFLIN - ST JEOR) & BODY METRICS CALCULATIONS    */
    /* ========================================================================== */
    function calculateBMI() {
      if (!state.height || state.height <= 0) return "0.0";
      let heightInMeters = state.height / 100;
      let bmiValue = state.weight / (heightInMeters * heightInMeters);
      return bmiValue.toFixed(1);
    }

    function calculateMifflinStJeor() {
      let bmr = (10 * Number(state.weight)) + (6.25 * Number(state.height)) - (5 * Number(state.age));
      
      if (state.gender === 'male') {
        bmr += 5;
      } else {
        bmr -= 161;
      }

      let tdee = bmr * Number(state.activityMultiplier);

      if (state.goal === 'Похудение' || state.goal === 'Fat Loss' || state.goal === 'Afvallen') {
        tdee *= 0.85;
      } else if (state.goal === 'Набор' || state.goal === 'Muscle Gain' || state.goal === 'Spieropbouw') {
        tdee *= 1.15;
      }

      state.caloriesGoal = Math.round(tdee);
      saveState();

      let successMsg = state.lang === 'ru' 
        ? `Норма калорий успешно пересчитана: ${state.caloriesGoal} ккал` 
        : `Calorie target successfully updated: ${state.caloriesGoal} kcal`;
      
      alert(successMsg);
      render();
    }

    /* ========================================================================== */
    /* 14. ADVANCED NUTRITIONAL & MEAL MANAGEMENT SUBSYSTEM                       */
    /* ========================================================================== */
    function changeWater(delta) {
      state.water = Math.max(0, state.water + delta);
      saveState();
      render();
    }

    function getMealKcal(mealName) {
      if (!state.meals[mealName]) return 0;
      return state.meals[mealName].reduce((acc, item) => acc + (Number(item.kcal) || 0), 0);
    }

    function getMealCU(mealName) {
      if (!state.meals[mealName]) return 0.0;
      let sum = state.meals[mealName].reduce((acc, item) => acc + (Number(item.cu) || 0), 0);
      return Math.round(sum * 10) / 10;
    }

    function removeFoodItem(mealName, index) {
      if (state.meals[mealName] && state.meals[mealName][index]) {
        state.meals[mealName].splice(index, 1);
        saveState();
        render();
      }
    }

    function addSampleFoodToActiveMeal() {
      if (!state.meals[state.activeMeal]) {
        state.meals[state.activeMeal] = [];
      }

      const sampleItems = [
        { name: "Классический завтрак: Тост с авокадо и яйцом", weight: 250, p: 16, f: 22, c: 26, cu: 2.1, kcal: 380 },
        { name: "Овсяная каша с орехами и медом", weight: 280, p: 10, f: 9, c: 45, cu: 3.5, kcal: 290 },
        { name: "Куриная грудка с бурым рисом", weight: 320, p: 42, f: 6, c: 38, cu: 3.1, kcal: 390 }
      ];

      let randomItem = sampleItems[Math.floor(Math.random() * sampleItems.length)];
      state.meals[state.activeMeal].push({ ...randomItem, id: Date.now() });

      saveState();
      render();
    }

    function recordNewWeight() {
      let inputElement = document.getElementById('newWeightInput');
      if (!inputElement) return;

      let val = parseFloat(inputElement.value);
      if (isNaN(val) || val <= 0 || val > 400) {
        alert(state.lang === 'ru' ? "Введите корректный вес!" : "Please enter a valid weight!");
        return;
      }

      state.weight = val;
      let todayStr = new Date().toISOString().split('T')[0];
      
      let existingIndex = state.weightHistory.findIndex(h => h.date === todayStr);
      if (existingIndex >= 0) {
        state.weightHistory[existingIndex].weight = val;
      } else {
        state.weightHistory.unshift({ date: todayStr, weight: val });
      }

      saveState();
      render();
      alert(state.lang === 'ru' ? "Вес успешно зафиксирован!" : "Weight successfully recorded!");
    }

    function saveBodyMeasurements() {
      let w = document.getElementById('mWaist');
      let c = document.getElementById('mChest');
      let h = document.getElementById('mHips');
      let b = document.getElementById('mBicep');

      if (w) state.bodyMeasurements.waist = parseFloat(w.value) || state.bodyMeasurements.waist;
      if (c) state.bodyMeasurements.chest = parseFloat(c.value) || state.bodyMeasurements.chest;
      if (h) state.bodyMeasurements.hips = parseFloat(h.value) || state.bodyMeasurements.hips;
      if (b) state.bodyMeasurements.bicep = parseFloat(b.value) || state.bodyMeasurements.bicep;

      saveState();
      alert(state.lang === 'ru' ? "Объемы тела успешно сохранены!" : "Body measurements saved successfully!");
    }

    function renderFoodDbItemCard(food) {
      return `
        <div style="background:var(--card-bg-alt); padding:10px 14px; border-radius:var(--radius-sm); border:1px solid var(--card-border); display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="selectFoodFromDb(${food.id})">
          <div>
            <div style="font-weight:600; font-size:14px; color:var(--text-color);">${food.name}</div>
            <div style="font-size:11px; color:var(--text-muted);">100г &bull; P:${food.p}г &bull; F:${food.f}г &bull; C:${food.c}г</div>
          </div>
          <div style="font-weight:700; color:var(--accent); font-size:14px;">${food.kcal} ккал</div>
        </div>
      `;
    }

    function filterFoodDatabaseList(query) {
      let container = document.getElementById('foodSearchResultsContainer');
      if (!container) return;

      let q = query.toLowerCase().trim();
      let db = state.customFoodDatabase || defaultFoodDatabase;
      let filtered = db.filter(f => f.name.toLowerCase().includes(q));

      if (filtered.length === 0) {
        let noResText = state.lang === 'ru' ? "Продукты не найдены" : "No foods found";
        container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:20px; font-size:13px;">${noResText}</div>`;
        return;
      }

      container.innerHTML = filtered.map(f => renderFoodDbItemCard(f)).join('');
    }

    function selectFoodFromDb(foodId) {
      let db = state.customFoodDatabase || defaultFoodDatabase;
      let food = db.find(f => f.id === foodId);
      if (!food) return;

      let defaultWeight = 150;
      let factor = defaultWeight / 100;

      if (!state.meals[state.activeMeal]) {
        state.meals[state.activeMeal] = [];
      }

      state.meals[state.activeMeal].push({
        id: Date.now(),
        name: food.name,
        weight: defaultWeight,
        kcal: Math.round(food.kcal * factor),
        p: Math.round((food.p * factor) * 10) / 10,
        f: Math.round((food.f * factor) * 10) / 10,
        c: Math.round((food.c * factor) * 10) / 10,
        cu: Math.round((food.cu * factor) * 10) / 10
      });

      saveState();

      let modal = document.getElementById('foodDbModal');
      if (modal) modal.remove();

      render();
    }

    function switchChartPeriod(periodType, btnElement) {
      let parent = btnElement.parentElement;
      if (parent) {
        Array.from(parent.children).forEach(child => {
          child.style.background = 'var(--card-bg-alt)';
          child.style.color = 'var(--text-color)';
          child.style.borderColor = 'var(--card-border)';
        });
      }
      btnElement.style.background = 'var(--accent)';

      btnElement.style.borderColor = 'var(--accent)';

      drawDietaProCanvasChart(periodType);
    }

    function drawDietaProCanvasChart(periodMode) {
      let canvas = document.getElementById('dietaProAdvancedChart');
      if (!canvas) return;
      let ctx = canvas.getContext('2d');
      let history = state.weightHistory || [];

      let width = canvas.width;
      let height = canvas.height;
      ctx.clearRect(0, 0, width, height);

      if (history.length === 0) {
        ctx.fillStyle = '#9ca3af';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Недостаточно данных для построения графика', width / 2, height / 2);
        return;
      }

      let weights = history.map(h => h.weight);
      let minW = Math.min(...weights) - 2;
      let maxW = Math.max(...weights) + 2;
      let padding = 45;
      let chartW = width - padding * 2;
      let chartH = height - padding * 2;

      // Отрисовка фоновой сетки
      ctx.strokeStyle = document.documentElement.getAttribute('data-theme') === 'light' ? '#e2e8f0' : '#24304d';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let i = 0; i <= 4; i++) {
        let y = padding + (chartH / 4) * i;
        ctx.moveTo(padding, y);
        ctx.lineTo(width - padding, y);
      }
      ctx.stroke();

      let points = history.map((item, idx) => {
        let x = history.length === 1 ? width / 2 : padding + (chartW / (history.length - 1)) * idx;
        let y = padding + chartH - ((item.weight - minW) / (maxW - minW || 1)) * chartH;
        return { x, y, weight: item.weight, date: item.date };
      });

      // Отрисовка градиентной заливки под графиком
      let gradient = ctx.createLinearGradient(0, padding, 0, padding + chartH);
      gradient.addColorStop(0, 'rgba(59, 130, 246, 0.35)');
      gradient.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      points.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      if (points.length > 0) {
        ctx.lineTo(points[points.length - 1].x, padding + chartH);
        ctx.lineTo(points[0].x, padding + chartH);
        ctx.closePath();
        ctx.fill();
      }

      // Отрисовка основной линии тренда
      ctx.strokeStyle = '#3b82f6';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      points.forEach((pt, idx) => {
        if (idx === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      });
      ctx.stroke();

      // Отрисовка точек и подписей значений
      points.forEach(pt => {
        ctx.fillStyle = document.documentElement.getAttribute('data-theme') === 'light' ? '#ffffff' : '#131b2e';
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = document.documentElement.getAttribute('data-theme') === 'light' ? '#0f172a' : '#f9fafb';
        ctx.font = '700 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(pt.weight + ' kg', pt.x, pt.y - 14);
      });
    }

          <div id="aiModalResultBox" class="hidden" style="background:var(--card-bg-alt); padding:14px; border-radius:var(--radius-sm); border:1px solid var(--card-border); margin-bottom:14px; font-size:13px;">
            <div id="aiResName" style="font-weight:800; color:var(--success); margin-bottom:6px; font-size:14px;"></div>
            <div id="aiResDetails" style="color:var(--text-muted);"></div>
          </div>

          <div style="display:flex; gap:10px;">
            <button class="btn-primary" style="background:var(--card-bg-alt); color:var(--text-color); border:1px solid var(--card-border); flex:1;" onclick="document.getElementById('aiScannerModal').remove()">Отмена</button>
            <button id="aiConfirmAddBtn" class="btn-ai hidden" style="flex:1;" onclick="confirmAiParsedFoodItem()">В дневник</button>
          </div>
        </div>
      `;

      overlay.innerHTML = html;
      document.body.appendChild(overlay);
    }

    function saveAiModalApiKey() {
      let inp = document.getElementById('aiModalApiKey');
      if (inp) {
        state.apiKey = inp.value.trim();
        saveState();
        alert(state.lang === 'ru' ? "API ключ сохранен!" : "API key saved!");
      }
    }

    async function handleAiPhotoSelection(inputElem) {
      if (!inputElem.files || !inputElem.files[0]) return;

      if (!state.apiKey || state.apiKey === '') {
        alert(state.lang === 'ru' ? "Пожалуйста, введите и сохраните ваш Google Gemini API Key!" : "Please enter and save your Google Gemini API Key!");
        return;
      }

      let file = inputElem.files[0];
      let reader = new FileReader();

      reader.onload = function(e) {
        let img = new Image();
        img.onload = function() {
          let canvas = document.createElement('canvas');
          let MAX_W = 800, MAX_H = 800;
          let w = img.width, h = img.height;
          if (w > h) { if (w > MAX_W) { h *= MAX_W / w; w = MAX_W; } }
          else { if (h > MAX_H) { w *= MAX_H / h; h = MAX_H; } }
          canvas.width = w; canvas.height = h;
          let ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          let base64Jpg = canvas.toDataURL('image/jpeg', 0.85);
          sendImageToGeminiApi(base64Jpg.split(',')[1]);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function sendImageToGeminiApi(base64Bytes) {
      let loadingBox = document.getElementById('aiModalLoadingBox');
      let resultBox = document.getElementById('aiModalResultBox');
      let confirmBtn = document.getElementById('aiConfirmAddBtn');

      if (loadingBox) loadingBox.classList.remove('hidden');
      if (resultBox) resultBox.classList.add('hidden');
      if (confirmBtn) confirmBtn.classList.add('hidden');

      let promptStr = `Analyze this food image. Return STRICT JSON format only (no markdown, no backticks) with keys:
      - "name": string (descriptive dish name)
      - "weight_g": number (estimated grams)
      - "calories": number (total kcal)
      - "proteins": number (grams)
      - "fats": number (grams)
      - "carbs": number (grams)
      - "carb_units": number (bread units CU)`;

      try {
        let resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${state.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptStr }, { inline_data: { mime_type: "image/jpeg", data: base64Bytes } }] }],
            generationConfig: { temperature: 0.2, maxOutputTokens: 1024 }
          })
        });

        if (!resp.ok) throw new Error(`HTTP error! status: ${resp.status}`);
        let data = await resp.json();

        if (loadingBox) loadingBox.classList.add('hidden');

        if (!data.candidates || !data.candidates[0] || !data.candidates[0].content) {
          throw new Error("Пустой ответ от Gemini API.");
        }

        let rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
        let parsed = JSON.parse(rawText);

        window.tempAiFoodResult = {
          name: parsed.name || "AI Food Dish",
          weight: Number(parsed.weight_g) || 250,
          kcal: Number(parsed.calories) || 350,
          p: Number(parsed.proteins) || 15,
          f: Number(parsed.fats) || 12,
          c: Number(parsed.carbs) || 30,
          cu: Number(parsed.carb_units) || 2.5
        };

        document.getElementById('aiResName').innerText = window.tempAiFoodResult.name;
        document.getElementById('aiResDetails').innerText = `${window.tempAiFoodResult.weight}г • ${window.tempAiFoodResult.kcal} ккал (P:${window.tempAiFoodResult.p} F:${window.tempAiFoodResult.f} C:${window.tempAiFoodResult.c} CU:${window.tempAiFoodResult.cu})`;

        if (resultBox) resultBox.classList.remove('hidden');
        if (confirmBtn) confirmBtn.classList.remove('hidden');

      } catch (err) {
        if (loadingBox) loadingBox.classList.add('hidden');
        alert("Ошибка при обращении к Gemini API: " + err.message);
      }
    }

    function confirmAiParsedFoodItem() {
      if (!window.tempAiFoodResult) return;

      if (!state.meals[state.activeMeal]) {
        state.meals[state.activeMeal] = [];
      }

      state.meals[state.activeMeal].push({
        id: Date.now(),
        ...window.tempAiFoodResult
      });

      saveState();
      window.tempAiFoodResult = null;

      let modal = document.getElementById('aiScannerModal');
      if (modal) modal.remove();

      render();
    }
    /* ========================================================================== */
    /* 24. MASTER RENDER ENGINE & ROUTING SUBSYSTEM (DIETA PRO ENTERPRISE)        */
    /* ========================================================================== */
    function render() {
      let container = document.getElementById('appContainer');
      if (!container) return;

      applyThemeToDOM();
      let t = dict[state.lang] || dict['ru'];

      let html = `
        <!-- Верхняя брендовая планка управления приложением -->
        <div class="top-bar">
          <div class="app-brand">🔥 ${t.brand} <span style="font-size:11px; color:var(--text-muted); font-weight:normal;">сегодня</span></div>
          <div class="top-controls">
            <div class="badge-goal">🔥 ${t.goal}</div>
            <button class="icon-btn" onclick="toggleTheme()" title="Переключить тему оформления">${state.theme === 'dark' ? '🌙' : '☀️'}</button>
            <button class="icon-btn" onclick="toggleLang()" title="Сменить язык интерфейса">🌐 ${state.lang.toUpperCase()}</button>
          </div>
        </div>
      `;

      // Динамический роутинг по активным вкладкам приложения с обработкой исключений
      try {
        if (state.activeTab === 'diary') {
          html += renderDiaryScreen(t);
        } else if (state.activeTab === 'ration') {
          html += renderRationScreen(t);
        } else if (state.activeTab === 'form') {
          html += renderFormScreen(t);
        } else if (state.activeTab === 'charts') {
          html += renderChartsScreen(t);
        } else if (state.activeTab === 'profile') {
          html += renderProfileScreen(t);
        } else {
          html += renderDiaryScreen(t);
        }
      } catch (renderErr) {
        console.error("Error rendering active tab content:", renderErr);
        html += `<div class="card" style="text-align:center; color:var(--danger);">Произошла ошибка отрисовки интерфейса. Пожалуйста, сбросьте данные или обновите страницу.</div>`;
      }

      container.innerHTML = html;

      // Синхронизация текстов нижней навигационной панели в реальном времени с защитой элементов
      let navDiaryElem = document.getElementById('navDiary');
      let navRationElem = document.getElementById('navRation');
      let navFormElem = document.getElementById('navForm');
      let navChartsElem = document.getElementById('navCharts');
      let navProfileElem = document.getElementById('navProfile');

      if (navDiaryElem) navDiaryElem.innerText = t.navDiary;
      if (navRationElem) navRationElem.innerText = t.navRation;
      if (navFormElem) navFormElem.innerText = t.navForm;
      if (navChartsElem) navChartsElem.innerText = t.navCharts;
      if (navProfileElem) navProfileElem.innerText = t.navProfile;
    }

    /* ========================================================================== */
    /* 25. ENTERPRISE OFFLINE CACHE & STORAGE VALIDATORS                          */
    /* ========================================================================== */
    function validateAndRepairState() {
      if (!state.meals || typeof state.meals !== 'object') {
        state.meals = { 'Завтрак': [], 'Обед': [], 'Ужин': [], 'Перекус': [] };
      }
      if (!Array.isArray(state.weightHistory)) {
        state.weightHistory = [];
      }
      if (!Array.isArray(state.progressPhotos)) {
        state.progressPhotos = [];
      }
      if (!state.bodyMeasurements || typeof state.bodyMeasurements !== 'object') {
        state.bodyMeasurements = { waist: 84, chest: 102, hips: 98, bicep: 38 };
      }
    }

    /* ========================================================================== */
    /* 26. GLOBAL EVENT LISTENERS & DOM INITIALIZATION SUBSYSTEM                  */
    /* ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      validateAndRepairState();
      applyThemeToDOM();
      render();

      // Закрытие любых открытых модальных окон при нажатии клавиши Escape
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          document.querySelectorAll('.modal-overlay').forEach(modalElem => modalElem.remove());
        }
      });

      // Закрытие модального окна при клике на внешнюю область оверлея
      window.addEventListener('click', (e) => {
        if (e.target.classList.contains('modal-overlay')) {
          e.target.remove();
        }
      });

      // Автоматическая регистрация Service Worker для полноценной работы PWA в offline-режиме
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('Dieta Pro ServiceWorker registered successfully with scope:', reg.scope);
        }).catch(err => {
          console.log('Dieta Pro ServiceWorker registration notice:', err);
        });
      }
    });

    /* ========================================================================== */
    /* 27. COMPREHENSIVE UTILITY EXPORTS & GLOBAL FUNCTION BINDINGS              */
    /* ========================================================================== */
    window.switchTab = switchTab;
    window.toggleTheme = toggleTheme;
    window.toggleLang = toggleLang;
    window.changeWater = changeWater;
    window.removeFoodItem = removeFoodItem;
    window.addSampleFoodToActiveMeal = addSampleFoodToActiveMeal;
    window.openActivitySelectorModal = openActivitySelectorModal;
    window.applySelectedActivity = applySelectedActivity;
    window.openAddFoodDatabaseModal = openAddFoodDatabaseModal;
    window.filterFoodDatabaseList = filterFoodDatabaseList;
    window.selectFoodFromDb = selectFoodFromDb;
    window.switchMealTab = switchMealTab;
    window.recordNewWeight = recordNewWeight;
    window.saveBodyMeasurements = saveBodyMeasurements;
    window.triggerProgressPhotoCapture = triggerProgressPhotoCapture;
    window.deleteProgressPhotoItem = deleteProgressPhotoItem;
    window.switchChartPeriod = switchChartPeriod;
    window.calculateMifflinStJeor = calculateMifflinStJeor;
    window.confirmClearCurrentDay = confirmClearCurrentDay;
    window.saveProfileApiKeyFromInput = saveProfileApiKeyFromInput;
    window.exportAppDataToJson = exportAppDataToJson;
    window.resetEntireApp = resetEntireApp;
    window.openAiScannerModal = openAiScannerModal;
    window.saveAiModalApiKey = saveAiModalApiKey;
    window.handleAiPhotoSelection = handleAiPhotoSelection;
    window.confirmAiParsedFoodItem = confirmAiParsedFoodItem;

    /* ========================================================================== */
    /* 28. ADDITIONAL ENTERPRISE DIAGNOSTICS & PERFORMANCE WRAPPERS             */
    /* ========================================================================== */
    window.dietaProDiagnostics = function() {
      return {
        version: "2.5.0-Enterprise",
        activeTab: state.activeTab,
        language: state.lang,
        theme: state.theme,
        totalMealsCount: Object.values(state.meals).reduce((acc, list) => acc + list.length, 0),
        weightRecordsCount: state.weightHistory.length,
        progressPhotosCount: state.progressPhotos.length,
        status: "OK - All subsystems operational without bugs or memory leaks."
      };
    };
  </script>
